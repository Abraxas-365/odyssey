# ODYSSEY — local stack: Postgres + IAMKit (users, auth, permissions) + API + worker.
#
#   make dev     # first run: secrets, IAMKit, seed, API
#   make up      # build and start everything
#   make seed    # provision IAMKit from iam/permissions.json -> .env
#
# IAMKit is built from its source checkout (IAMKIT_SRC, default
# ~/Desktop/Proyectos/iam). Ports avoid the other local stacks
# (5433-5437, 8080-8084, 8090-8094).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5438}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odyssey"]
      interval: 2s
      timeout: 3s
      retries: 30

  iamkit:
    build:
      context: ${IAMKIT_SRC:-../../Desktop/Proyectos/iam}
    image: iamkit:odyssey-dev
    ports:
      - "127.0.0.1:${IAMKIT_PORT:-8085}:8080"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/iamkit?sslmode=disable
      SERVER_PORT: "8080"
      JWT_PRIVATE_KEY_PATH: /secrets/jwt.pem
      JWT_ISSUER: ${IAMKIT_ISSUER:-http://localhost:8085}
      OIDC_HMAC_SECRET: ${OIDC_HMAC_SECRET:?Set OIDC_HMAC_SECRET in .env}
      IAMKIT_ENCRYPTION_KEY: ${IAMKIT_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5178}
    volumes:
      - ./secrets/jwt.pem:/secrets/jwt.pem:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: odyssey-api:dev
    ports:
      - "127.0.0.1:${ODYSSEY_PORT:-8095}:8095"
    environment:
      PORT: "8095"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/odyssey?sslmode=disable
      IAMKIT_URL: http://iamkit:8080
      IAMKIT_ISSUER: ${IAMKIT_ISSUER:-http://localhost:8085}
      IAMKIT_PUBLIC_URL: ${IAMKIT_PUBLIC_URL:-http://localhost:8085}
      IAMKIT_AUDIENCE: ${IAMKIT_AUDIENCE:-}
      IAMKIT_ENVIRONMENT_ID: ${IAMKIT_ENVIRONMENT_ID:-}
      IAMKIT_APPLICATION_ID: ${IAMKIT_APPLICATION_ID:-}
      IAMKIT_RESOURCE_ID: ${IAMKIT_RESOURCE_ID:-}
      IAMKIT_WEB_CLIENT_ID: ${IAMKIT_WEB_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      iamkit:
        condition: service_healthy

  # Outbox delivery (audit trail, reactions), workflows and scheduled tasks.
  worker:
    image: odyssey-api:dev
    entrypoint: ["odyssey-worker"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/odyssey?sslmode=disable
      WORKER_HEALTH_PORT: "8096"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
