name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (gofmt, vet, tests vs Postgres, race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # pgtest creates and drops one database per test on this server; with
      # REQUIRE_DB a missing database fails instead of skipping.
      ODYSSEY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      ODYSSEY_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l agent api cmd internal proto)" || (gofmt -l agent api cmd internal proto && exit 1)
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - name: install protoc (the version generated files name)
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: generated code is fresh (permissions, fleet protocol, agent deepcopy, CRD, RBAC)
        run: make gen && git diff --exit-code internal/permission agent proto && test -z "$(git status --porcelain agent proto)"
      - name: tests (unit, architecture, contract, Postgres)
        run: go test -count=1 -race ./...
      - run: make build

  kube:
    name: the fleet (gateway + agent + releasefleet) vs a real cluster (k3s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A throwaway k3s and Postgres (testcontainers).
      - run: make test-kube

  frontend:
    name: console (api types, typecheck, oxlint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11 (npm 10.9 crashes on this tree)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
