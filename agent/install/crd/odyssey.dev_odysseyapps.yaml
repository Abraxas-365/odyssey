---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: odysseyapps.odyssey.dev
spec:
  group: odyssey.dev
  names:
    categories:
    - odyssey
    kind: OdysseyApp
    listKind: OdysseyAppList
    plural: odysseyapps
    shortNames:
    - oapp
    singular: odysseyapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.revision
      name: Revision
      type: integer
    - jsonPath: .status.observedRevision
      name: Observed
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OdysseyApp is one app in one environment: the agent turns it into a
          Deployment, a Service and an Ingress in the same namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OdysseyAppSpec is what the cluster must run for one app in one environment.
              It mirrors the control plane's release.DesiredApp (field for field).
            properties:
              access:
                description: |-
                  Access says who may open the app. Absent means public (an object
                  written before access existed); the agent never exposes a protected
                  app in a cluster that cannot protect it.
                properties:
                  mode:
                    description: AccessMode is who may open an app.
                    enum:
                    - public
                    - team
                    - organization
                    type: string
                  organization:
                    description: |-
                      Organization is the app's organization id: what the team mode
                      compares the user's organization with.
                    type: string
                required:
                - mode
                type: object
              ai:
                description: |-
                  AI wires the app to the organization's AI gateway: the agent sets
                  OPENAI_BASE_URL/ANTHROPIC_BASE_URL and reads OPENAI_API_KEY/
                  ANTHROPIC_API_KEY from the managed secret named by KeySecret (these four
                  win over the same names in env, secrets and resources). Absent: no AI.
                properties:
                  baseURL:
                    description: |-
                      BaseURL is the gateway without "/v1": ANTHROPIC_BASE_URL is it as it is,
                      OPENAI_BASE_URL adds /v1.
                    maxLength: 2000
                    minLength: 1
                    type: string
                  keySecret:
                    description: KeySecret is the managed secret (one of spec.secrets)
                      that holds the key.
                    pattern: ^[A-Za-z_][A-Za-z0-9_]{0,127}$
                    type: string
                required:
                - baseURL
                - keySecret
                type: object
              env:
                additionalProperties:
                  type: string
                description: Env holds non-secret configuration.
                type: object
              healthPath:
                description: HealthPath must answer 2xx/3xx once the app is ready
                  to serve.
                pattern: ^/
                type: string
              image:
                description: 'Image is pinned by digest: registry/repository@sha256:<64
                  hex>.'
                pattern: ^[^\s@]+@sha256:[a-f0-9]{64}$
                type: string
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels identify the app's objects (project, environment, release,
                  deployment); they are copied to everything the agent creates.
                type: object
              port:
                description: Port the app listens on (PORT is set to it unless env
                  says otherwise).
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                format: int32
                maximum: 20
                minimum: 1
                type: integer
              resources:
                description: |-
                  Resources are the environment's resources the app uses (databases,
                  caches, files). The pod reads their connection from the Secrets the
                  agent keeps for them (never from here); a resource's variable wins over
                  the same name in env. The app does not start until every one is ready.
                items:
                  description: ResourceRefSpec is a resource of the environment an
                    app uses.
                  properties:
                    kind:
                      description: |-
                        ResourceKind is what an OdysseyResource provisions (the same names as
                        pkg/resourcekind: the control plane and the agent share them).
                      enum:
                      - postgres
                      - redis
                      - files
                      type: string
                    name:
                      description: Name of the OdysseyResource in the app's namespace.
                      maxLength: 30
                      type: string
                    prefix:
                      description: Prefix goes before the variables the app reads
                        the resource by.
                      maxLength: 40
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              revision:
                description: |-
                  Revision increases with every deployment of the environment. Whoever
                  applies the spec never lowers it, so a superseded deployment cannot win
                  late; status.observedRevision says which revision the status describes.
                format: int64
                minimum: 1
                type: integer
              secrets:
                description: |-
                  Secrets are the app's secret variables: references only, never a value.
                  Each becomes an environment variable of the same name that the pod reads
                  from a Secret (a name here wins over the same name in env). The app does
                  not start until every one of them is available.
                items:
                  description: SecretRefSpec is one secret variable of an app.
                  properties:
                    key:
                      description: Key is the external secret's key in the store.
                      type: string
                    name:
                      description: Name is the environment variable the app reads
                        it as.
                      pattern: ^[A-Za-z_][A-Za-z0-9_]{0,127}$
                      type: string
                    property:
                      description: Property selects a field of the external secret
                        (optional).
                      type: string
                    source:
                      description: SecretSource is where a secret's value comes from.
                      enum:
                      - managed
                      - external
                      type: string
                    store:
                      description: Store is the ClusterSecretStore an external secret
                        is read from.
                      type: string
                    version:
                      description: |-
                        Version of a managed secret's value: the app does not start until the
                        cluster holds this version or a newer one.
                      format: int64
                      type: integer
                  required:
                  - name
                  - source
                  type: object
                  x-kubernetes-validations:
                  - message: a managed secret needs a version of at least 1
                    rule: self.source != 'managed' || (has(self.version) && self.version
                      >= 1)
                  - message: an external secret needs a store and a key
                    rule: self.source != 'external' || (has(self.store) && size(self.store)
                      > 0 && has(self.key) && size(self.key) > 0)
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - healthPath
            - image
            - port
            - replicas
            - revision
            type: object
          status:
            description: OdysseyAppStatus is what the agent observed.
            properties:
              message:
                description: Message is the cluster's detail for people (in English,
                  as Kubernetes says it).
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation of the spec this status
                  describes. A spec change at the same revision (e.g. the access mode)
                  bumps the generation: the status is stale until the agent re-observes.
                format: int64
                type: integer
              observedRevision:
                description: ObservedRevision is the spec revision this status describes.
                format: int64
                type: integer
              phase:
                description: Phase is how the cluster sees the app at status.observedRevision.
                enum:
                - progressing
                - ready
                - failed
                type: string
              readyReplicas:
                format: int32
                type: integer
              reason:
                description: Reason explains a failed phase.
                enum:
                - ""
                - image_pull
                - crash
                - unhealthy
                - config
                - resource
                type: string
              url:
                description: URL is where the app answers.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
