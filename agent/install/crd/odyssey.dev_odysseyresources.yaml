---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: odysseyresources.odyssey.dev
spec:
  group: odyssey.dev
  names:
    categories:
    - odyssey
    kind: OdysseyResource
    listKind: OdysseyResourceList
    plural: odysseyresources
    shortNames:
    - ores
    singular: odysseyresource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.generation
      name: Generation
      type: integer
    - jsonPath: .status.observedGeneration
      name: Observed
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.storage
      name: Storage
      type: string
    - jsonPath: .spec.recipe
      name: Recipe
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OdysseyResource is one resource (database, cache, files volume) of one
          environment: the agent turns it into the objects that provide it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OdysseyResourceSpec is the desired state of one resource of an environment.
              The CR is named after the resource and lives in the environment's namespace.
            properties:
              deleted:
                description: |-
                  Deleted asks for the resource and its data to be removed. The agent
                  reports phase deleted and then removes this object.
                type: boolean
              generation:
                description: |-
                  Generation grows with every change of the desired state. Whoever
                  applies the spec never lowers it, so an older message cannot win late;
                  status.observedGeneration says which generation the status describes.
                format: int64
                minimum: 1
                type: integer
              kind:
                description: |-
                  ResourceKind is what an OdysseyResource provisions (the same names as
                  pkg/resourcekind: the control plane and the agent share them).
                enum:
                - postgres
                - redis
                - files
                type: string
              postgres:
                description: |-
                  Postgres are the database's settings (kind postgres; none: one
                  instance with the engine's defaults).
                properties:
                  cpu:
                    description: |-
                      CPU and Memory are Kubernetes quantities, each set as request and
                      limit of every instance.
                    maxLength: 16
                    type: string
                  instances:
                    description: 'Instances: 1 (no replica) to 5. They follow every
                      change.'
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  major:
                    description: |-
                      Major is the PostgreSQL major version. It is fixed when the database
                      is made: a different one later fails the resource (a major upgrade is
                      a migration, not a setting).
                    enum:
                    - 0
                    - 16
                    - 17
                    - 18
                    format: int32
                    type: integer
                  memory:
                    maxLength: 16
                    type: string
                type: object
              recipe:
                description: |-
                  Recipe is the catalog recipe@version that resolved it
                  ("postgres-produccion@1"), for people reading the cluster; the agent
                  acts on the settings below only.
                maxLength: 80
                type: string
              storage:
                description: |-
                  Storage is the volume's size ("5Gi"). It may grow, never shrink: a
                  smaller value is ignored.
                pattern: ^[1-9][0-9]*Gi$
                type: string
            required:
            - generation
            - kind
            - storage
            type: object
          status:
            description: OdysseyResourceStatus is what the agent observed.
            properties:
              message:
                description: Message says why it is not ready (in English, short).
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec.generation this status
                  describes.
                format: int64
                type: integer
              phase:
                description: ResourcePhase is how the cluster sees the resource.
                enum:
                - provisioning
                - ready
                - failed
                - deleted
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
