apiVersion: v1
kind: ServiceAccount
metadata:
  name: odyssey-agent
  namespace: odyssey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odyssey-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odyssey-agent
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
---
# Leader election lease, only in odyssey-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odyssey-agent
  namespace: odyssey-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odyssey-agent
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
---
# What the agent may only do inside the namespaces of environments: keep the
# apps' Secrets and make, grow and ERASE the data of resources (volumes,
# databases, caches). Never bound cluster-wide: the agent binds it with a
# RoleBinding of the same name in each environment namespace it creates
# (desired.Namespaces), so it can neither read the Secrets of the rest of
# the cluster nor delete anyone else's volumes, databases or workloads. The
# cluster-wide role (rbac/role.yaml, generated) holds only the reads the
# caches and watches need for these kinds. The agent may bind this role and no
# other (bind, resourceNames), and policy.yaml refuses a binding outside its
# namespaces or for anyone but the agent. Kept by hand: the kubebuilder
# markers must not grant these verbs (agent/install_test.go checks it).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odyssey-agent-environment
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, update, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [create, update, delete]
  # The egress fence (agent/egress): odicea-apps, odicea-resources,
  # odicea-default and odicea-ai in each environment namespace. The enforcer
  # reads them by name straight from the API (no cache, so no list/watch and
  # nothing cluster-wide) and never patches.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, delete]
---
# The one ConfigMap the agent keeps in its own namespace: the cluster policy
# it last received (agent/egress.PolicyConfigMap). get and update only on that
# name; create cannot be restricted by name (Kubernetes does not know it yet).
# Kept by hand (the kubebuilder markers would grant the verbs on every
# ConfigMap of the namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odyssey-agent-policy
  namespace: odyssey-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [odyssey-cluster-policy]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odyssey-agent-policy
  namespace: odyssey-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odyssey-agent-policy
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
