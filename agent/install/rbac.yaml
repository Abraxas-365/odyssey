apiVersion: v1
kind: ServiceAccount
metadata:
  name: odyssey-agent
  namespace: odyssey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odyssey-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odyssey-agent
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
---
# Leader election lease, only in odyssey-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odyssey-agent
  namespace: odyssey-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odyssey-agent
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
---
# The apps' Secrets (managed secret values, written by the agent). Never
# bound cluster-wide: the agent binds it with a RoleBinding of the same name
# in each environment namespace it creates (desired.Namespaces), so it cannot
# read or change the Secrets of the rest of the cluster. It may bind this
# role and no other (bind, resourceNames), and policy.yaml refuses a binding
# outside its namespaces or for anyone but the agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odyssey-agent-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
