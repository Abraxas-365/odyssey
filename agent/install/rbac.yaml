apiVersion: v1
kind: ServiceAccount
metadata:
  name: odyssey-agent
  namespace: odyssey-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odyssey-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odyssey-agent
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
---
# Leader election lease, only in odyssey-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odyssey-agent
  namespace: odyssey-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odyssey-agent
subjects:
  - kind: ServiceAccount
    name: odyssey-agent
    namespace: odyssey-system
