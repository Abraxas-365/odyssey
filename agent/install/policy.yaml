# The environment role (odyssey-agent-environment, rbac.yaml) is bound only
# where the agent keeps apps' Secrets and the data of resources: a
# RoleBinding of it is admitted in a namespace Odyssey created for an
# environment (managed-by=odyssey) and only for the agent's service account.
# So neither the agent nor a mistake can grant it over the Secrets, volumes
# and databases of the rest of the cluster (kube-system, other teams). The
# agent cannot relabel an existing namespace (it may only create namespaces),
# so it cannot make one of someone else's match.
# ValidatingAdmissionPolicy is GA since Kubernetes 1.30.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: odyssey-agent-environment
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [rolebindings]
  matchConditions:
    - name: binds-the-environment-role
      expression: object.roleRef.name == 'odyssey-agent-environment'
  validations:
    - expression: >-
        namespaceObject.metadata.name.startsWith('odyssey-') &&
        namespaceObject.metadata.?labels[?'app.kubernetes.io/managed-by'].orValue('') == 'odyssey'
      message: the odyssey-agent-environment role may only be bound in a namespace Odyssey created for an environment
    - expression: >-
        object.roleRef.kind == 'ClusterRole' && size(object.subjects) == 1 &&
        object.subjects.all(s, s.kind == 'ServiceAccount' && s.namespace == 'odyssey-system' && s.name == 'odyssey-agent')
      message: the odyssey-agent-environment role may only be bound to the odyssey-agent service account
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: odyssey-agent-environment
spec:
  policyName: odyssey-agent-environment
  validationActions: [Deny]
