apiVersion: apps/v1
kind: Deployment
metadata:
  name: odyssey-agent
  namespace: odyssey-system
  labels:
    app.kubernetes.io/name: odyssey-agent
    app.kubernetes.io/part-of: odyssey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odyssey-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odyssey-agent
    spec:
      serviceAccountName: odyssey-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: odyssey-agent
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect"]
          env:
            # The agent's Secret (odyssey-agent) lives here. It is created
            # by the install command the console shows (token, gateway,
            # ca-pin); the agent enrols with it and keeps its identity there.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # Its own pod: build pods run the agent's image (prepare step).
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # Its service account: bound to the Secrets role (odyssey-agent-secrets)
            # only in the environment namespaces it creates.
            - name: ODYSSEY_SERVICE_ACCOUNT
              valueFrom:
                fieldRef: { fieldPath: spec.serviceAccountName }
            # Where apps answer (k3d maps the ingress to localhost:8088).
            - name: ODYSSEY_APPS_DOMAIN
              value: apps.odyssey.localhost
            - name: ODYSSEY_APPS_URL_PORT
              value: "8088"
            # Building: the registry images go to, as the nodes reach it,
            # makes this cluster a builder (empty: it does not build).
            # - name: ODYSSEY_REGISTRY
            #   value: registry.example.com/odyssey
            # - name: ODYSSEY_REGISTRY_INSECURE   # plain HTTP (a local registry)
            #   value: "true"
          ports:
            - name: health
              containerPort: 8097
            - name: source
              containerPort: 8099
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
