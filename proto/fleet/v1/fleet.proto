// Package fleet.v1 is the protocol between the control plane (odyssey-gateway)
// and the agent installed in each cluster. The agent always dials out: a
// cluster behind a firewall needs no inbound port. Every call but Enroll
// runs over mutual TLS with the certificate the cluster got at enrolment.
//
// Compatibility: fields are only added. A renamed or removed field is a new
// package (fleet.v2), served side by side while agents upgrade.
syntax = "proto3";

package fleet.v1;

option go_package = "github.com/Abraxas-365/odyssey/proto/fleet/v1;fleetv1";

service Fleet {
  // Enroll trades a one-time enrolment token and a certificate signing
  // request for the cluster's client certificate. The private key never
  // leaves the cluster. No client certificate is needed.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Renew issues a new certificate for a fresh key before the current one
  // expires (mutual TLS with the current certificate).
  rpc Renew(RenewRequest) returns (RenewResponse);
  // Recover hands the cluster's current certificate back to the holder of
  // its key, proven by a certificate request signed with it: an agent whose
  // Enroll or Renew answer was lost (the token spent, or the old certificate
  // no longer accepted) gets what was issued. Nothing is signed or changed.
  // No client certificate is needed.
  rpc Recover(RecoverRequest) returns (RecoverResponse);
  // Connect is the tunnel: the agent says Hello and reports what it
  // observes; the control plane sends the desired state. Either side may
  // close it; the agent reconnects with backoff.
  rpc Connect(stream AgentMessage) returns (stream ControlMessage);
  // FetchSource streams the source archive (tar.gz) of a build sent to this
  // cluster, while the build is wanted: another cluster's build is
  // PermissionDenied, an unknown, cancelled or finished one NotFound. The
  // agent checks the bytes against Build.source before using them.
  rpc FetchSource(FetchSourceRequest) returns (stream SourceChunk);
}

message FetchSourceRequest {
  string build_id = 1;
}

message SourceChunk {
  bytes data = 1;
}

message EnrollRequest {
  // token is the one-time token shown when the cluster was created.
  string token = 1;
  // csr is a PKCS#10 certificate request (DER) for the cluster's key.
  bytes csr = 2;
}

message EnrollResponse {
  string cluster_id = 1;
  string organization_id = 2;
  Certificate certificate = 3;
}

message RenewRequest {
  bytes csr = 1;
}

message RenewResponse {
  Certificate certificate = 1;
}

message RecoverRequest {
  // Which cluster: the enrolment token after a lost Enroll answer (it names
  // the cluster; spent is fine), or the ids after a lost Renew answer.
  string token = 1;
  string organization_id = 2;
  string cluster_id = 3;
  // csr is a PKCS#10 request (DER) signed with the key the certificate was
  // issued for: the proof of holding it.
  bytes csr = 4;
}

message RecoverResponse {
  string cluster_id = 1;
  string organization_id = 2;
  Certificate certificate = 3;
}

message Certificate {
  // pem is the client certificate (PEM).
  bytes pem = 1;
  // ca_pem is the fleet CA that issued it (PEM).
  bytes ca_pem = 2;
}

message AgentMessage {
  oneof message {
    // hello is the first message of every stream.
    Hello hello = 1;
    AppReport report = 2;
    // build_report says how builds are going (sent on every change, and for
    // every build the cluster holds right after Hello).
    BuildReport build_report = 3;
    // build_log carries lines a build printed, in order. Lines may be sent
    // again (after a reconnect): their seq makes that harmless.
    BuildLog build_log = 4;
    // secret_ack answers a ControlMessage.secret.
    SecretAck secret_ack = 5;
    // resource_report says how the environments' resources are (2b): a full
    // one (every resource the cluster holds) right after Hello, then changes.
    ResourceReport resource_report = 6;
    // policy_ack answers a ControlMessage.cluster_policy (and is sent again
    // right after Hello for the generation the agent keeps).
    PolicyAck policy_ack = 7;
    // scan_report says what the vulnerability scan (3c) found in built images:
    // sent when a scan ends, and again for every scan the cluster still holds
    // right after Hello. A separate message, not a field of BuildStatus: a
    // build's status is final once it succeeds (and the build is dropped from
    // the cluster right after), while its scan ends minutes later.
    ScanReport scan_report = 8;
  }
}

message ControlMessage {
  oneof message {
    // apply hands the agent the desired state of one app. Applying it twice,
    // or a revision older than the one the cluster has, changes nothing.
    App apply = 1;
    // build asks the cluster to build an image; asking again changes nothing.
    Build build = 2;
    // cancel_build: the build is no longer wanted (cancelled, or finished
    // and recorded): stop it if it runs and drop what the cluster keeps of it.
    CancelBuild cancel_build = 3;
    // secret delivers one managed secret value, sealed to the cluster's
    // secret_key. The agent answers with a secret_ack either way.
    Secret secret = 4;
    // resource hands the agent the desired state of one resource (a
    // database, a cache, a files volume). Applying it twice, or a generation
    // older than the one the cluster has, changes nothing.
    Resource resource = 5;
    // cluster_policy is what TI set for the whole cluster (2d): sent right
    // after Hello and on every change. The agent keeps it (ConfigMap
    // odyssey-cluster-policy) so it holds across restarts and lost streams,
    // and answers with a policy_ack. A generation older than the one it
    // keeps changes nothing.
    ClusterPolicy cluster_policy = 6;
  }
}

// ClusterPolicy is the cluster-wide rules TI sets from the console (2d).
message ClusterPolicy {
  // generation grows with every change.
  int64 generation = 1;
  EgressPolicy egress = 2;
}

// EgressPolicy is where the apps of the cluster may connect to (2d). Every
// app may always reach: DNS, its own environment's resources (same
// namespace), the sign-in gate's keys (odyssey-access:8099) and, when it
// uses AI, the AI gateway (App.ai.base_url's host, resolved by the agent).
message EgressPolicy {
  // mode is "internet" (public internet: every address but private,
  // loopback, CGNAT and link-local ranges, so no cloud metadata and nothing
  // internal unless listed in allow) or "restricted" (only allow). Empty
  // means "internet": the default before TI sets one.
  string mode = 1;
  // allow are CIDRs (IPv4 or IPv6) the apps may also reach, internal ones
  // included (e.g. "10.20.0.0/16" for a corporate database).
  repeated string allow = 2;
}

// PolicyAck says whether the agent enforces a ClusterPolicy generation.
message PolicyAck {
  int64 generation = 1;
  // error is empty when it is enforced; else why not (the previous one
  // stays in force).
  string error = 2;
  // warnings are what TI should review although the policy is enforced (an
  // allow entry that includes a node of the cluster, 2d). The agent also
  // sends an ack with the current state when it changes (a node joined, a
  // namespace could not be written), not only in answer to a policy.
  repeated string warnings = 3;
}

// Secret is a managed secret's value on its way to the cluster.
message Secret {
  // delivery_id names this delivery (the ack echoes it).
  string delivery_id = 1;
  string organization_id = 2;
  string project_id = 3;
  string environment_id = 4;
  // app is the app's name in the cluster: the value goes to its secret store.
  string app = 5;
  string name = 6;
  int64 version = 7;
  // key_id is the cluster key it was sealed to.
  string key_id = 8;
  // sealed is HPKE single-shot output (enc || ciphertext) made by
  // pkg/secretbox: its info binds it to this cluster, environment, name and
  // version, so it opens for nothing else.
  bytes sealed = 9;
}

// SecretAck answers a Secret.
message SecretAck {
  string delivery_id = 1;
  // error is empty when the value was stored (or a newer version already
  // was); otherwise it says why not (wrong key, cannot open, cannot write).
  string error = 2;
}

message Hello {
  string agent_version = 1;
  Capabilities capabilities = 2;
}

// Capabilities are what the cluster offers apps (placement and blueprints
// read them).
message Capabilities {
  string kubernetes_version = 1;
  // apis are the optional platform APIs installed, by API group
  // (e.g. "postgresql.cnpg.io", "kyverno.io", "gateway.networking.k8s.io").
  // It also lists "odicea.access" when the agent can protect apps with the
  // sign-in gate (access mode team/organization): the gate is installed and
  // configured AND the cluster has traefik.io. An agent that does not list it
  // (every agent older than 1e too) must not be sent a protected app.
  // "odicea.ai" (2d): the agent wires App.ai into the app. An agent without
  // it must not be sent an app with ai. "odicea.egress" (2d): the agent
  // enforces ClusterPolicy.egress with NetworkPolicies (the cluster's
  // network plugin must enforce them: TI's part). "odicea.retire": the agent
  // removes an app sent with App.deleted (and reports it "deleted"); an
  // agent without it must not be sent one (it would run it again).
  // "odicea.service-settings" (MS-4): the agent honors the services of
  // SecretRef, ResourceRef, AI and Service.env (settings of some services
  // only) and rolls only the services whose pods change. An agent without
  // it would hand every setting to every service: it must not be sent one
  // with services.
  repeated string apis = 2;
  repeated string ingress_classes = 3;
  repeated string storage_classes = 4;
  // builder is set when the cluster can build images (unset: it cannot).
  Builder builder = 5;
  // secret_key is the cluster's public key for managed secrets (2a): a
  // person's value is sealed to it in the browser and only this cluster can
  // open it. Unset: the cluster cannot take managed secrets.
  SecretKey secret_key = 6;
  // secret_stores are the ClusterSecretStores (External Secrets Operator)
  // TI registered, by name: where external secrets may be read from.
  repeated string secret_stores = 7;
  // resource_kinds are the resources the cluster can provision (2b):
  // "postgres" (CloudNativePG installed), "redis" (always, with a storage
  // class) and "files" (a default storage class). An agent that does not
  // list a kind (every agent older than 2b) must not be sent one.
  // The capability "odicea.scan" (3c), among apis, says the agent scans the
  // images it builds. Without it, builds of the cluster have no scan.
  repeated string resource_kinds = 8;
  // resource_capabilities are what the agent honours beyond preparing a
  // kind's basic resource (stage 1a of the catalog): "spec/v1" (it reads
  // Resource.spec), "builtin:postgres:instances", "builtin:postgres:version",
  // "builtin:postgres:resources". A recipe goes only to a cluster announcing
  // everything it requires; an agent that lists none gets basic resources.
  repeated string resource_capabilities = 9;
}

// SecretKey is an HPKE (RFC 9180) public key.
message SecretKey {
  // key_id names the key: base64url(sha256(public_key)), first 16 chars.
  string key_id = 1;
  // public_key is the KEM's serialized public key (32 bytes for X25519).
  bytes public_key = 2;
  // suite is "DHKEM-X25519-HKDF-SHA256/HKDF-SHA256/AES-256-GCM", the only one.
  string suite = 3;
}

// Builder is the cluster's image builder.
message Builder {
  // registry is where built images are pushed and pulled from, as the
  // cluster's nodes reach it (host[:port][/path], e.g. "registry.example.com/odyssey").
  string registry = 1;
  // platforms it builds for (e.g. "linux/amd64").
  repeated string platforms = 2;
  // identity names everything that shapes an image besides the code: the
  // builder's pinned images and versions, the platform and the registry
  // ("b1:<sha256 hex>"). Two builds of the same code with the same identity
  // make the same app, so the control plane may reuse the first one's
  // image (Build.reuse_image). Empty (agents older than MS-3b): never reused.
  string identity = 3;
}

// Build asks the cluster to turn a source into an image.
message Build {
  string build_id = 1;
  string organization_id = 2;
  string project_id = 3;
  string environment_id = 4;
  SourceRef source = 5;
  // image_repository is where to push the image (the registry the cluster
  // announced, then "<organization>/<project>"); the agent reports only the
  // digest it got.
  string image_repository = 6;
  // cache_ref is the registry reference of the project's build cache.
  string cache_ref = 7;
  // timeout_seconds bounds the build in the cluster.
  int32 timeout_seconds = 8;
  // reuse_image ("<image_repository>@sha256:<64 hex>") is an image an
  // earlier build made of the same code with the same builder identity.
  // When it is still in the registry the agent tags it as this build's and
  // reports it succeeded with that digest and reused set, without building;
  // when it is gone, it builds as usual. An agent that does not know the
  // field builds as usual too.
  string reuse_image = 9;
  // skip_scan: the reused image's scan is recent and the control plane
  // copies it, so a reused image is not scanned again (a built one is).
  bool skip_scan = 10;
}

// SourceRef is what FetchSource must return for a build.
message SourceRef {
  string sha256 = 1;
  int64 size = 2;
}

message CancelBuild {
  string build_id = 1;
}

message BuildReport {
  repeated BuildStatus builds = 1;
}

message BuildStatus {
  string build_id = 1;
  // phase is "pending", "running", "succeeded" or "failed".
  string phase = 2;
  // image_digest ("sha256:<64 hex>") of the pushed image (succeeded only).
  string image_digest = 3;
  // reason explains a failed phase: "unsupported", "source", "push",
  // "timeout" or "failed".
  string reason = 4;
  string message = 5;
  // reused: the build succeeded by reusing Build.reuse_image (nothing was
  // built; image_digest is the reused image's).
  bool reused = 6;
}

// ScanReport carries the scans that ended. A cluster whose agent lists the
// capability "odicea.scan" scans every image it builds, right after the build
// succeeds, and never delays the build for it.
message ScanReport {
  repeated ScanStatus scans = 1;
}

// ScanStatus is the outcome of one image scan. The control plane keeps it
// only when image_digest is the one the build reported.
message ScanStatus {
  string build_id = 1;
  // image_digest ("sha256:<64 hex>") is what was scanned.
  string image_digest = 2;
  // Findings by severity, counted once per vulnerability and package.
  int32 critical = 3;
  int32 high = 4;
  int32 medium = 5;
  int32 low = 6;
  // tool names the scanner and its version ("trivy 0.76.2").
  string tool = 7;
  // db_updated_at (RFC 3339) is when the scanner's vulnerability database
  // was built; empty when unknown.
  string db_updated_at = 8;
  // error is non-empty when the scan could not be done (no network to
  // download the database, the registry refused it, ...): the counts mean
  // nothing and the image counts as not scanned.
  string error = 9;
}

message BuildLog {
  string build_id = 1;
  repeated LogLine lines = 2;
}

message LogLine {
  // seq orders the lines of a build and is stable across resends (it is
  // derived from where the line was printed, not from when it was sent).
  int64 seq = 1;
  // stream is "prepare", "build" or "system".
  string stream = 2;
  string text = 3;
}

// App is the desired state of one app: the spec of its OdysseyApp.
message App {
  string organization_id = 1;
  string project_id = 2;
  string environment_id = 3;
  // name is the app's DNS-label name in the cluster.
  string name = 4;
  // revision grows with every deployment of the environment.
  int64 revision = 5;
  string image = 6;
  int32 port = 7;
  string health_path = 8;
  int32 replicas = 9;
  map<string, string> env = 10;
  map<string, string> labels = 11;
  // access says who may open the app (1e "Quién puede abrirla"). An agent
  // without the gate refuses (fail closed) any mode other than public.
  Access access = 12;
  // secrets are the app's secret variables (2a): references only, never a
  // value. A name here wins over the same name in env.
  repeated SecretRef secrets = 13;
  // resources are the environment's resources the app uses (2b): the agent
  // wires their connection (kept in the cluster, never sent) into the app's
  // environment and does not start a revision until they are ready.
  repeated ResourceRef resources = 14;
  // ai connects the app to the organization's AI gateway (2d). Unset: the
  // app has no AI.
  AI ai = 15;
  // deleted: the app was retired (its project archived). The agent removes
  // it with everything it runs (not the environment's resources: their data
  // stays) and reports it "deleted" at this revision. Only the ids, name and
  // revision are set.
  bool deleted = 16;
  // services are the app's workloads (MS-2), in order. For an app of one
  // web service at "/" the top-level image, port, health_path and replicas
  // repeat it (an agent without "odicea.services" ignores this field and
  // runs those); for any other they are empty, and the control plane sends
  // it only to an agent that lists "odicea.services" (an older one would
  // fail visibly, never serve half of the app). Empty: the app is one web
  // service at "/" made of the top-level fields (as before services).
  repeated Service services = 17;
}

// Service is one workload of an app. Its objects are named after the app
// ("<app>" for the service at "/", "<app>-<name>" for any other); they are
// selected by the label odyssey.dev/workload, never by odyssey.dev/app.
message Service {
  // name is 1-20 lowercase letters and digits, starting with a letter.
  string name = 1;
  // kind is "web" (answers HTTP on port) or "worker" (no port, no route).
  string kind = 2;
  // route is the path of the app's address the service answers ("/",
  // "/api"); empty: an internal web service (reachable by the app's other
  // services only) or a worker.
  string route = 3;
  // strip_prefix removes route from the path before the request reaches
  // the service.
  bool strip_prefix = 4;
  string image = 5;
  // port and health_path are 0 and "" for a worker.
  int32 port = 6;
  string health_path = 7;
  int32 replicas = 8;
  // env are variables of this service only (MS-4): they win over the
  // app's env of the same name (never over secrets, resources or the AI,
  // which the control plane keeps from colliding).
  map<string, string> env = 9;
}

// AI is how an app reaches the AI gateway (freerouter): its key is a
// managed secret of the app (listed in App.secrets, delivered sealed like
// any other), never sent here.
message AI {
  // base_url is the gateway as apps reach it, without "/v1"
  // (e.g. "https://ai.example.com"). The agent sets OPENAI_BASE_URL =
  // base_url + "/v1" and ANTHROPIC_BASE_URL = base_url.
  string base_url = 1;
  // key_secret names the SecretRef in App.secrets that holds the key
  // ("ODICEA_AI_KEY"): the agent sets OPENAI_API_KEY and ANTHROPIC_API_KEY
  // from it.
  string key_secret = 2;
  // services are the services that get the AI's variables (MS-4); empty:
  // every service of the app.
  repeated string services = 3;
}

// SecretRef is one secret variable of an app.
message SecretRef {
  // name is the environment variable the app reads it as.
  string name = 1;
  // source is "managed" (a value a person loaded, delivered sealed with a
  // Secret message) or "external" (read by the External Secrets Operator).
  string source = 2;
  // version of a managed secret's value: the agent must not start the app
  // until its secret store holds this version or a newer one.
  int64 version = 3;
  // store, key and property locate an external secret: the
  // ClusterSecretStore, the remote key and (optional) the property in it.
  string store = 4;
  string key = 5;
  string property = 6;
  // services are the services that read it (MS-4); empty: every service of
  // the app. A name the app no longer has reaches nobody (never everyone).
  repeated string services = 7;
}

// Access is the app's exposure policy.
message Access {
  // mode is "public" (anyone with the link), "team" (users of the app's
  // organization) or "organization" (any user of the IAMKit environment).
  // Empty means "public" and exists only for revisions created before 1e;
  // the control plane always sends an explicit mode from 1e on.
  string mode = 1;
}

// AppReport carries what the agent observes. A full report (sent once per
// stream, right after Hello) lists every app; the rest carry only changes.
message AppReport {
  bool full = 1;
  repeated AppStatus apps = 2;
}

message AppStatus {
  string environment_id = 1;
  string name = 2;
  // observed_revision is the desired revision the status describes
  // (0: the agent has not acted on the app yet).
  int64 observed_revision = 3;
  // phase is "progressing", "ready", "failed" or "deleted" (an App.deleted
  // was carried out: nothing of the app runs any more).
  string phase = 4;
  // reason explains a failed phase: "unhealthy", "image_pull", "crash", "config",
  // "resource" (a resource the app uses did not become ready in time).
  string reason = 5;
  string message = 6;
  int32 ready_replicas = 7;
  string url = 8;
  // services is how each service's rollout of observed_revision is going
  // (MS-2; empty from an older agent). The app's phase is their aggregate:
  // ready when every one is, failed when one failed.
  repeated ServiceStatus services = 9;
}

// ServiceStatus is one service's part of an AppStatus.
message ServiceStatus {
  string name = 1;
  // phase is "progressing", "ready" or "failed"; reason and message as in
  // AppStatus.
  string phase = 2;
  string reason = 3;
  string message = 4;
  int32 ready_replicas = 5;
}

// ResourceRef is one resource of the environment an app uses (2b).
message ResourceRef {
  // name is the resource's name in its environment (a DNS label).
  string name = 1;
  // kind is "postgres", "redis" or "files".
  string kind = 2;
  // prefix goes before the variables the app reads it by (empty: none):
  // postgres → DATABASE_URL, PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD;
  // redis → REDIS_URL; files → FILES_DIR (the volume is mounted at
  // /data/<name>). With prefix "ANALYTICS", ANALYTICS_DATABASE_URL, …
  string prefix = 3;
  // services are the services wired to it (MS-4); empty: every service of
  // the app (a "files" volume, ReadWriteOnce: only the first one).
  repeated string services = 4;
}

// Resource is the desired state of one resource of an environment (2b): a
// database (CloudNativePG), a cache (Redis) or a files volume. Its
// credentials are made in the cluster and never leave it.
message Resource {
  string organization_id = 1;
  string project_id = 2;
  string environment_id = 3;
  // name is unique in the environment (a DNS label, at most 30 characters).
  string name = 4;
  // kind is "postgres", "redis" or "files"; it never changes.
  string kind = 5;
  // generation grows with every change of the desired state.
  int64 generation = 6;
  // storage is the volume's size (a Kubernetes quantity, e.g. "1Gi"); it
  // may grow, never shrink.
  string storage = 7;
  // deleted: the resource and its data are to be removed.
  bool deleted = 8;
  // recipe is the catalog recipe@version that resolved it
  // ("postgres-produccion@1"), for people reading the cluster; the agent acts
  // on the spec below only.
  string recipe = 9;
  // spec_schema_version is the version of the spec below (0: none, the basic
  // resource every agent prepares). An agent sent a version it does not
  // know rejects the resource: the control plane only sends a spec to an
  // agent announcing "spec/v<n>" in Capabilities.resource_capabilities.
  int32 spec_schema_version = 10;
  // spec is how the kind's engine prepares it, resolved by the control
  // plane (never the recipe itself). Unset: the basic resource.
  oneof spec {
    BuiltinPostgres builtin_postgres = 11;
  }
}

// BuiltinPostgres are the settings of a CloudNativePG database. A zero field
// is the engine's default (and needs no capability).
message BuiltinPostgres {
  // instances: 1 (no replica) to 5. Needs "builtin:postgres:instances".
  int32 instances = 1;
  // major: the PostgreSQL major version (16, 17 or 18), fixed once the
  // database exists. Needs "builtin:postgres:version".
  int32 major = 2;
  // cpu and memory: Kubernetes quantities, each set as request and limit.
  // Need "builtin:postgres:resources".
  string cpu = 3;
  string memory = 4;
}

// ResourceReport carries what the agent observes of resources. full: the
// report holds every resource status the agent has (the control plane forgets
// the statuses missing from it); a set too big for one message goes as
// partial reports instead.
message ResourceReport {
  bool full = 1;
  repeated ResourceStatus resources = 2;
}

message ResourceStatus {
  string environment_id = 1;
  string name = 2;
  // observed_generation is the desired generation the status describes.
  int64 observed_generation = 3;
  // phase is "provisioning", "ready", "failed" or "deleted" (gone from the
  // cluster: the control plane may forget it).
  string phase = 4;
  // message says why it is not ready, in plain words.
  string message = 5;
}
