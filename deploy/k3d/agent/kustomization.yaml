# The agent as the local k3d cluster installs it (make agent-image): the
# stock install plus the in-cluster registry (deploy/k3d/registry), which
# makes the cluster a builder, and the egress rule build pods need to push
# to it (the base policy blocks private addresses).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../agent/install
  - builds-registry.yaml
patches:
  - target:
      kind: Deployment
      name: odyssey-agent
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ODYSSEY_REGISTRY
          value: zot.odyssey-registry.svc.cluster.local:5000/odyssey
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ODYSSEY_REGISTRY_INSECURE
          value: "true"
  # Sign-in gate ("Quién puede abrirla"). Browsers use the API's public
  # address; the gate (a pod) fetches the ticket keys from the host as
  # k3d names it. Needs `make run` on :8095 (ODYSSEY_PORT).
  - target:
      kind: Deployment
      name: odyssey-agent
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ODYSSEY_ACCESS_ENABLED
          value: "true"
  - target:
      kind: Deployment
      name: odyssey-access
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odyssey-access
      spec:
        template:
          spec:
            containers:
              - name: access
                env:
                  - name: ODYSSEY_ACCESS_ISSUER
                    value: http://localhost:8095
                  - name: ODYSSEY_ACCESS_JWKS_URL
                    value: http://host.k3d.internal:8095/.well-known/odicea-access-keys
