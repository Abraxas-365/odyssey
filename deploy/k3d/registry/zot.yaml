apiVersion: v1
kind: ConfigMap
metadata:
  name: zot
  namespace: odyssey-registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: odyssey
data:
  # Plain HTTP, no auth: it is only reachable inside the cluster (and
  # build pods through the builds-registry NetworkPolicy).
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
      },
      "log": {
        "level": "info"
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot
  namespace: odyssey-registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: odyssey
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: odyssey-registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: odyssey
spec:
  replicas: 1
  strategy:
    type: Recreate # one volume, one writer
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/part-of: odyssey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          # v2.1.22 (multi-arch index digest).
          image: ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet: { path: /v2/, port: registry }
          livenessProbe:
            httpGet: { path: /v2/, port: registry }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: zot
        - name: data
          persistentVolumeClaim:
            claimName: zot
---
# The ClusterIP is fixed: ../registries.yaml points the node's containerd at
# it (the node cannot resolve the Service's DNS name).
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: odyssey-registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: odyssey
spec:
  clusterIP: 10.43.200.200
  selector:
    app.kubernetes.io/name: zot
  ports:
    - name: registry
      port: 5000
      targetPort: registry
