openapi: 3.1.0
info:
  title: Odyssey API
  version: 0.1.0
  summary: Control plane of Odyssey (Odicea), the governed platform to ship internal apps.
  description: |
    The HTTP contract of `odyssey-api`. Written by hand; `docs/api.md` holds the
    rules every endpoint follows (statuses, errors, lists, PATCH semantics) and
    this file the exact shapes.

    Guarded by `internal/bootstrap/openapi_test.go`:
    - every route the server mounts is documented here and every operation here
      is mounted (no undocumented or phantom endpoints);
    - every operation's `x-permissions` is exactly what the route enforces;
    - real responses (successes and errors) validate against these schemas.

    The console's TypeScript types are generated from this file
    (`make api-types` → `frontend/src/lib/openapi.gen.ts`).

    Compatibility (docs/api.md §8): additive changes only within `/api/v1`.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: platform
    description: Health and public configuration (no token).
  - name: projects
    description: A project groups everything a team ships. The console calls it an "app".
  - name: deployments
    description: What runs in each environment - publishing, progress, history and going back.
  - name: clusters
    description: The organization's Kubernetes clusters, where apps run (TI's Infraestructura → Clústeres).
  - name: audit
    description: The organization's tamper-evident activity trail.
  - name: github
    description: Connecting apps to their GitHub repositories.
  - name: mcp
    description: The endpoint coding agents use (Model Context Protocol), with its own OAuth resource.

paths:
  /health:
    get:
      tags: [platform]
      operationId: health
      summary: Liveness and database reachability
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/config:
    get:
      tags: [platform]
      operationId: getPublicConfig
      summary: Sign-in settings for the console
      description: Holds no secrets; the console reads it before signing in.
      security: []
      responses:
        "200":
          description: Public configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }

  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects
      description: "Order: `lower(name)`, then `id`."
      x-permissions: [odyssey:projects:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default `active`.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ProjectStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created. `Location` points at the new project.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Change a project's name or description
      description: Absent fields are unchanged; a patch that changes nothing writes nothing. The slug is immutable.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: The project after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [projects]
      operationId: archiveProject
      summary: Archive a project (idempotent)
      x-permissions: [odyssey:projects:write]
      responses:
        "200":
          description: The archived project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [projects]
      operationId: listEnvironments
      summary: List a project's environments
      description: "Not paginated (a project has a handful). Order: production, staging, previews, then `slug`."
      x-permissions: [odyssey:projects:read]
      parameters:
        - name: kind
          in: query
          description: Repeatable (OR).
          schema:
            type: array
            items: { $ref: "#/components/schemas/EnvironmentKind" }
          style: form
          explode: true
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [projects]
      operationId: getEnvironment
      summary: Get an environment
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/current:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [deployments]
      operationId: getCurrentRelease
      summary: What an environment serves
      description: The release online, the deployment that put it there and the one in progress. Before the first deployment every field but `environment_id` is empty.
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The environment's current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentRelease" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/deployments:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: List an environment's deployments
      description: "Order: newest first."
      x-permissions: [odyssey:deployments:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR).
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeploymentStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of deployments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [deployments]
      operationId: deploy
      summary: Publish an image or a folder
      description: |
        **An image** (`application/json`): creates a release (the image
        pinned by digest plus its configuration) and starts deploying it.

        **A folder** (`multipart/form-data`, parts in this order: `config`,
        the JSON configuration; then `source`, the folder as `.tar.gz`, at
        most 100 MiB and 20 000 files): stores it and starts a deployment that
        builds it first (status `building`, step `build`); the release is
        created when its image is ready. A build that fails fails the
        deployment with the build's code and leaves the app as it was.
        Uploaded folders count against the organization's quota (10 GiB
        compressed by default): when full, the oldest folders already built
        are dropped (their images stay); when none can be, 422
        `SOURCE_QUOTA`.

        Answers 202: the worker applies it, waits for its health check and
        only then makes it the environment's current release; poll the
        deployment (`Location`). A deployment in progress in the environment
        is cancelled (and its build, if it was building). If the new version
        fails once applied while another was online, the platform restores
        that one (a deployment with reason `auto_rollback`).
      x-permissions: [odyssey:deployments:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequest" }
          multipart/form-data:
            schema:
              type: object
              required: [config, source]
              properties:
                config: { $ref: "#/components/schemas/DeploySourceConfig" }
                source: { type: string, format: binary, description: The folder as tar.gz. }
            encoding:
              config: { contentType: application/json }
              source: { contentType: application/gzip }
      responses:
        "202":
          description: The deployment, pending (an image) or building (a folder). `Location` is its URL.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/deployments/{deployment}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - $ref: "#/components/parameters/Deployment"
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: Get a deployment and its progress
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/deployments/{deployment}/rollback:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - $ref: "#/components/parameters/Deployment"
    post:
      tags: [deployments]
      operationId: rollbackDeployment
      summary: Go back to this version
      description: |
        Deploys again the release of `deployment`, which must have gone live
        (`ready`). It creates a new deployment (reason `rollback`), not a new
        release. No body.
      x-permissions: [odyssey:deployments:rollback]
      responses:
        "202":
          description: The new deployment, pending. `Location` is its URL.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/releases/{release}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: release
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [deployments]
      operationId: getRelease
      summary: Get a release
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/builds/{build}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Build"
    get:
      tags: [deployments]
      operationId: getBuild
      summary: Get a build
      description: The image built from an uploaded source, for a deployment's `build` step.
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Build" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/builds/{build}/logs:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Build"
    get:
      tags: [deployments]
      operationId: getBuildLogs
      summary: Read a build's log
      description: |
        Lines after `after`, in order. Poll with `after` = the page's `next`
        until `finished`. Live while it builds; kept after it ends.
      x-permissions: [odyssey:deployments:read]
      parameters:
        - name: after
          in: query
          description: Return lines with a larger `seq` (0 = from the start).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: 1–1000 (larger values are clamped), default 1000.
          schema: { type: integer, minimum: 0, default: 1000 }
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildLogPage" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters:
    get:
      tags: [clusters]
      operationId: listClusters
      summary: List the organization's clusters
      description: "Order: revoked last, then `lower(name)`, then `id`."
      x-permissions: [odyssey:clusters:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default all.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ClusterStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of clusters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [clusters]
      operationId: createCluster
      summary: Register a cluster
      description: >-
        Answers with the cluster and its one-time enrolment token, valid 24 h. The token is shown only here
        (only its hash is kept); install the agent with it. `FLEET_DISABLED` (422) when this installation has no
        gateway configured.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterCreate" }
      responses:
        "201":
          description: Created. `Location` points at the new cluster.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterCreated" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [clusters]
      operationId: getCluster
      summary: Get a cluster
      x-permissions: [odyssey:clusters:read]
      responses:
        "200":
          description: The cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/enrollment-token:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [clusters]
      operationId: issueClusterToken
      summary: Issue a new enrolment token
      description: >-
        Replaces the pending token (a lost or expired one). Enrolling an active cluster again (its agent lost its
        key) stops accepting its previous certificate. `CLUSTER_REVOKED` (422) for a revoked cluster.
      x-permissions: [odyssey:clusters:manage]
      responses:
        "200":
          description: The new token, shown only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [clusters]
      operationId: revokeCluster
      summary: Disconnect a cluster for good (idempotent)
      description: >-
        Its certificate stops being accepted and its tunnel closes at once; no app is placed there again. Apps
        already running there keep running without changes (`apps` counts them; their deployments fail with
        `CLUSTER_REVOKED` until they move) unless `move_to` names another active cluster: then they are moved
        there in the same transaction (`cluster.apps_moved`). Nothing moves on its own: the other cluster may be
        on another network or far from the apps' data. `INVALID_MOVE_TARGET` (422) refuses the whole request,
        revocation included. Revoking a revoked cluster records nothing, except the move if `move_to` is given.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterRevoke" }
      responses:
        "200":
          description: The revoked cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [clusters]
      operationId: moveClusterApps
      summary: Move the apps of a revoked cluster to another
      description: >-
        Pins every environment of the revoked cluster to `to` (an active cluster of the organization), whose
        agent deploys their apps from scratch; what the old cluster reported is dropped. Moving an empty cluster
        changes nothing. `CLUSTER_NOT_REVOKED` (422) for a cluster still running them, `INVALID_MOVE_TARGET`
        (422) for a `to` that is not another active cluster.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterMove" }
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterMoved" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: List the activity trail
      description: "Newest first (`seq` descending)."
      x-permissions: [odyssey:audit:read]
      parameters:
        - name: subject
          in: query
          description: One entity, `<kind>/<id>` (e.g. `project/…`).
          schema: { type: string }
        - name: type
          in: query
          description: Exact event types (repeatable, OR), e.g. `project.created`.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: correlation_id
          in: query
          description: Everything one request or workflow caused.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive. A date (`YYYY-MM-DD`, UTC) or an RFC 3339 instant.
          schema: { type: string }
        - name: to
          in: query
          description: A date includes the whole day; an instant is exclusive.
          schema: { type: string }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/audit/verify:
    get:
      tags: [audit]
      operationId: verifyAuditTrail
      summary: Re-hash the organization's whole chain
      x-permissions: [odyssey:audit:read]
      responses:
        "200":
          description: Whether the trail is intact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github:
    get:
      tags: [github]
      operationId: getGitHub
      summary: Whether GitHub is available on this Odyssey
      description: Holds no secrets. `enabled` is false when the GitHub App is not configured.
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The integration's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/install:
    get:
      tags: [github]
      operationId: getGitHubInstallURL
      summary: Where to send the user to install the GitHub App
      description: >-
        The URL carries a signed state naming the organization and who asked; GitHub sends the browser back to
        `/github/setup`. `return_to` is the console path to land on afterwards (default: the GitHub settings
        page). `GITHUB_NOT_CONFIGURED` (422) when this installation has no GitHub App; 400 when `return_to` is not
        a console path.
      x-permissions: [odyssey:integrations:manage]
      parameters:
        - name: return_to
          in: query
          description: A console path (starts with a single `/`), e.g. `/apps/visitas/conectar`.
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The GitHub URL to open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallURL" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/installations:
    post:
      tags: [github]
      operationId: claimGitHubInstallation
      summary: Link the GitHub installation of a claim to the organization
      description: >-
        Second step of linking an installation. `/github/setup` (public) only checks that the GitHub user owns
        (User account) or administers (Organization admin, which needs the App's `members: read` permission) the
        installation's account, and redirects the browser to the console with a signed, 15-minute `github_claim`
        bound to the organization and to the Odyssey user who asked for the install link. The console posts it here,
        logged in. Only that user, in that organization, can redeem it: any other user or organization, a forged or
        expired claim, answers `GITHUB_STATE_INVALID` (422) without saying which. Linking again to the same
        organization refreshes the installation; `GITHUB_INSTALLATION_TAKEN` (409) when another organization has it;
        `GITHUB_NOT_CONFIGURED` (422); `GITHUB_NO_ACCESS` (404) when GitHub no longer knows it and
        `GITHUB_UNAVAILABLE` (502) when it does not answer. `return_to` is the console path to land on (default:
        the GitHub settings page).
      x-permissions: [odyssey:integrations:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimGitHubInstallation" }
      responses:
        "200":
          description: The linked installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationClaimed" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }
    get:
      tags: [github]
      operationId: listGitHubInstallations
      summary: List the GitHub installations linked to the organization
      description: "Not paginated (an organization links a handful). Order: `lower(account)`, then `id`."
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The linked installations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/installations/{installation}:
    parameters:
      - $ref: "#/components/parameters/Installation"
    delete:
      tags: [github]
      operationId: unlinkGitHubInstallation
      summary: Unlink a GitHub installation
      description: >-
        The apps connected through it stop publishing (their connections stay, marked unreachable). The
        installation itself stays on GitHub; uninstalling the App is done there.
      x-permissions: [odyssey:integrations:manage]
      responses:
        "204":
          description: Unlinked. No body.
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/repositories:
    get:
      tags: [github]
      operationId: listGitHubRepositories
      summary: List the repositories the linked installations reach
      description: >-
        Across every linked installation, filtered by `search` on the full name. Each item says which
        installation reaches it. `GITHUB_UNAVAILABLE` (502) when GitHub does not answer.
      x-permissions: [odyssey:projects:write]
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of repositories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubRepositoryList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /api/v1/github/installations/{installation}/repositories/{repository}/branches:
    parameters:
      - $ref: "#/components/parameters/Installation"
      - name: repository
        in: path
        required: true
        description: GitHub's numeric repository id.
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [github]
      operationId: listGitHubBranches
      summary: List a repository's branches
      description: >-
        Not paginated. `GITHUB_NO_ACCESS` (404) when the installation no longer reaches the repository or is
        suspended; `GITHUB_UNAVAILABLE` (502) when GitHub does not answer.
      x-permissions: [odyssey:projects:write]
      responses:
        "200":
          description: The branches and their heads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubBranchList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /api/v1/projects/{id}/repository:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [github]
      operationId: getProjectRepository
      summary: Get the project's connected repository
      description: 404 when the project has no repository connected.
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryConnection" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [github]
      operationId: connectProjectRepository
      summary: Connect (or reconnect) the project to a repository branch
      description: >-
        Replaces the project's connection, if any. Every push to the branch then publishes to production, and the
        branch's current head is queued to publish now (see `publishProjectRepository`). An empty `branch` takes
        the repository's default branch. Errors: `PROJECT_ARCHIVED`, `GITHUB_NOT_CONFIGURED` (422);
        `GITHUB_NO_ACCESS` (404, the installation does not reach the repository or is suspended),
        `GITHUB_BRANCH_MISSING` (404), and 404 for an installation or project that is not the organization's; 409
        on a concurrent update (retry); `GITHUB_UNAVAILABLE` (502).
      x-permissions: [odyssey:projects:write, odyssey:deployments:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepository" }
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryConnection" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }
    delete:
      tags: [github]
      operationId: disconnectProjectRepository
      summary: Disconnect the project's repository
      description: Stops publishing from it; deployments already made stay. 404 when none is connected.
      x-permissions: [odyssey:projects:write]
      responses:
        "204":
          description: Disconnected. No body.
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/repository/publish:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [github]
      operationId: publishProjectRepository
      summary: Publish the branch head now
      description: >-
        Queues the head of the connected branch as a push (trigger `manual`); the commit is imported and deployed
        in the background. No body. It always queues, even the last commit published (publishing it again); older
        pushes still waiting are skipped. `PROJECT_ARCHIVED` (422); `GITHUB_NO_ACCESS` (404, the installation no
        longer reaches the repository or is suspended); `GITHUB_BRANCH_MISSING` (404); 409 when the connection
        changed meanwhile or on a concurrent update (retry); `GITHUB_UNAVAILABLE` (502).
      x-permissions: [odyssey:deployments:create]
      responses:
        "202":
          description: The push, queued. Poll `listProjectPushes` for its progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubPush" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /api/v1/projects/{id}/repository/pushes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [github]
      operationId: listProjectPushes
      summary: List the commits published from the repository
      description: "Newest first (`created_at` descending, then `id`)."
      x-permissions: [odyssey:deployments:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default all.
          schema:
            type: array
            items: { $ref: "#/components/schemas/PushStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of pushes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubPushList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /github/setup:
    get:
      tags: [github]
      operationId: gitHubSetup
      summary: Where GitHub sends the browser after installing the App
      description: >-
        Public (the user has no Odyssey token here: the signed `state` names the organization and the Odyssey user
        who asked, and the OAuth `code` proves the GitHub user owns the installation's account: is the User account
        itself, or an active admin of the Organization, which needs the App's `members: read` permission). It links
        nothing. Always answers 302 to the console, never a body or an error page. On success:
        `<console>/configuracion/github?github_claim=<claim>`, a signed 15-minute claim (carrying the return path)
        that the console posts, logged in, to `claimGitHubInstallation`. On failure:
        `<console>/configuracion/github?github_error=<CODE>`, where CODE is `GITHUB_NOT_CONFIGURED`,
        `GITHUB_STATE_INVALID` (bad or expired state), `GITHUB_NOT_YOURS` (the GitHub user does not own or
        administer the installation's account), `GITHUB_NO_ACCESS` or `GITHUB_UNAVAILABLE`.
      security: []
      parameters:
        - name: installation_id
          in: query
          description: GitHub's installation id.
          schema: { type: integer, format: int64 }
        - name: code
          in: query
          description: The user's OAuth code.
          schema: { type: string }
        - name: state
          in: query
          description: The signed state from `getGitHubInstallURL`.
          schema: { type: string }
        - name: setup_action
          in: query
          description: "`install`, `update`... as GitHub reports it. Ignored."
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the console (see above).
          headers:
            Location:
              required: true
              schema: { type: string }

  /webhooks/github:
    post:
      tags: [github]
      operationId: receiveGitHubWebhook
      summary: Where GitHub delivers the App's webhooks
      description: >-
        Public: the only proof is the HMAC-SHA256 signature of the exact body in `X-Hub-Signature-256` (401 when it
        does not hold; checked before anything else). Answers `202 {"status":"accepted"}` for everything it
        understood, including a delivery it had seen (`X-GitHub-Delivery` is remembered 7 days) and the events it
        ignores. `push` queues the new head of every connected project on that branch (once per commit);
        `installation` and `installation_repositories` refresh, suspend or unlink the installation and disconnect the
        projects whose repository was removed. 400 for a malformed delivery; `GITHUB_NOT_CONFIGURED` (422) when this
        installation has no GitHub App. Not under `/api/v1`: no token, no CORS.
      security: []
      parameters:
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: The delivery's unique id.
          schema: { type: string, maxLength: 100 }
        - name: X-GitHub-Event
          in: header
          required: true
          description: "`push`, `installation`, `installation_repositories`, `ping`... Others are accepted and ignored."
          schema: { type: string, maxLength: 100 }
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=<hex HMAC-SHA256 of the body with the App's webhook secret>`."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Accepted (also for a repeated delivery).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: The MCP endpoint coding agents connect to (Claude Code, Codex, VS Code, Antigravity)
      description: >-
        Model Context Protocol, Streamable HTTP transport, stateless with JSON responses (no session, no GET
        stream). Its own OAuth protected resource (RFC 9728) of IAMKit: the token must be issued for this
        resource (RFC 8707 `resource` claim, audience `<odicea>/mcp`) and IAMKit's introspection must say it is
        live. Console tokens are refused here, and these tokens are refused by `/api/v1`. Without a valid token:
        401 with `WWW-Authenticate: Bearer resource_metadata="…"`, which starts the agent's sign-in. 503 with
        `Retry-After` when IAMKit cannot be asked (fails closed). Each tool requires its own permissions
        (`tools/list` shows only those the user holds); the tools call the same operations as this API. Mounted
        only when the introspection client is configured.
      security:
        - mcp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A JSON-RPC 2.0 message or batch (MCP).
              type: [object, array]
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: A notification or response from the client was accepted.
        "400":
          description: Malformed MCP message.
        "401":
          description: No valid token for this resource; the challenge names the metadata.
          headers:
            WWW-Authenticate:
              schema: { type: string }
        "403":
          description: The token lacks a scope the request needs.
        "503":
          description: IAMKit could not check the token; retry later.
          headers:
            Retry-After:
              schema: { type: integer }
    get:
      tags: [mcp]
      operationId: mcpStream
      summary: Not served - the endpoint is stateless (no server-initiated stream)
      description: "Always 405 with `Allow: POST`, before any token check; MCP clients probe it and fall back to POST."
      security: []
      responses:
        "405":
          description: Only POST is served.
          headers:
            Allow:
              schema: { type: string, enum: [POST] }
    delete:
      tags: [mcp]
      operationId: mcpEndSession
      summary: Not served - the endpoint is stateless (no session to end)
      description: "Always 405 with `Allow: POST`, before any token check."
      security: []
      responses:
        "405":
          description: Only POST is served.
          headers:
            Allow:
              schema: { type: string, enum: [POST] }

  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [mcp]
      operationId: mcpResourceMetadata
      summary: Protected resource metadata of /mcp (RFC 9728)
      description: Public, CORS `*`. Names IAMKit as the authorization server and the permissions as scopes.
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }
    options:
      tags: [mcp]
      operationId: mcpResourceMetadataPreflight
      summary: CORS preflight of the metadata
      security: []
      responses:
        "204":
          description: Allowed from any origin.

  /.well-known/oauth-protected-resource:
    get:
      tags: [mcp]
      operationId: mcpRootResourceMetadata
      summary: The same metadata at the root well-known path (some clients probe it first)
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }
    options:
      tags: [mcp]
      operationId: mcpRootResourceMetadataPreflight
      summary: CORS preflight of the metadata
      security: []
      responses:
        "204":
          description: Allowed from any origin.

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: IAMKit access token
      description: The organization comes only from the token (docs/api.md §1).
    mcp:
      type: http
      scheme: bearer
      bearerFormat: IAMKit access token for the /mcp resource
      description: >-
        OAuth 2.1 with IAMKit (authorization code + PKCE, RFC 8707 resource). The agent discovers it from the
        protected resource metadata; admitted clients and consent are set in IAMKit.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Environment:
      name: environment
      in: path
      required: true
      schema: { type: string, format: uuid }
    Deployment:
      name: deployment
      in: path
      required: true
      schema: { type: string, format: uuid }
    Build:
      name: build
      in: path
      required: true
      schema: { type: string, format: uuid }
    Installation:
      name: installation
      in: path
      required: true
      description: The id of a linked GitHub installation (Odyssey's, not GitHub's).
      schema: { type: string, format: uuid }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: 1–100 (larger values are clamped), default 20.
      schema: { type: integer, minimum: 1, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }

  responses:
    Validation:
      description: Malformed input (also 405, 413, 415).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: No valid token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: Valid token without the required permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Missing, or another organization's.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Unique conflict (e.g. the slug) or a serialization failure (retry).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Business:
      description: Valid input that breaks a rule (`code` says which, e.g. `PROJECT_ARCHIVED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    External:
      description: An outside service (GitHub) failed or did not answer (`GITHUB_UNAVAILABLE`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Internal:
      description: Unexpected failure; the message is generic, the cause is logged with `request_id`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    PublicConfig:
      type: object
      additionalProperties: false
      required: [iam_url, client_id, environment_id]
      properties:
        iam_url: { type: string, description: "IAMKit's browser-facing base URL." }
        client_id: { type: string, description: 'Public OAuth client (code + PKCE); "" when not configured.' }
        environment_id: { type: string }

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      description: RFC 9728 protected resource metadata.
      properties:
        resource: { type: string, description: "The canonical resource URI (the tokens' audience): `<odicea>/mcp`." }
        authorization_servers: { type: array, items: { type: string }, description: IAMKit's issuer. }
        scopes_supported: { type: array, items: { type: string }, description: The permission catalog. }
        bearer_methods_supported: { type: array, items: { type: string } }
        resource_name: { type: string }
        resource_documentation: { type: string }

    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    Error:
      type: object
      additionalProperties: false
      required: [type, code, message, status_code, request_id]
      description: docs/api.md §3. Branch on `type` (closed set) and `code` (additive); never parse `message`.
      properties:
        type: { $ref: "#/components/schemas/ErrorType" }
        code: { type: string, examples: [VALIDATION, FORBIDDEN, PROJECT_ARCHIVED] }
        message: { type: string }
        status_code: { type: integer }
        details:
          type: object
          description: Present on some 4xx (e.g. `field`); never on 5xx.
          properties:
            field: { type: string }
          additionalProperties: true
        request_id: { type: string }

    ErrorType:
      type: string
      enum: [VALIDATION, AUTHORIZATION, NOT_FOUND, CONFLICT, BUSINESS, INTERNAL, EXTERNAL]

    Page:
      type: object
      additionalProperties: false
      required: [total, limit, offset]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    ProjectStatus:
      type: string
      enum: [active, archived]

    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, slug, description, status, created_by, updated_by, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        slug:
          type: string
          description: DNS label (no `--`), unique per organization forever; part of hostnames.
          pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
        description: { type: string, maxLength: 2000 }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          description: Derived from `name` when absent (accents folded).
        description: { type: string, maxLength: 2000 }

    ProjectPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    ProjectList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        page: { $ref: "#/components/schemas/Page" }

    EnvironmentKind:
      type: string
      enum: [production, staging, preview]

    Environment:
      type: object
      additionalProperties: false
      description: Where a project runs. Every project is born with `production`.
      required: [id, organization_id, project_id, slug, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        slug:
          type: string
          description: DNS label, unique in the project; part of hostnames.
          pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        created_at: { type: string, format: date-time }

    EnvironmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Environment" }

    ReleaseConfig:
      type: object
      additionalProperties: false
      required: [port, health_path, replicas, env]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        health_path: { type: string }
        replicas: { type: integer, minimum: 1, maximum: 10 }
        env:
          type: object
          additionalProperties: { type: string }

    Release:
      type: object
      additionalProperties: false
      description: An image pinned by digest plus the configuration it runs with. Immutable.
      required: [id, organization_id, project_id, image, config, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        image: { type: string }
        config: { $ref: "#/components/schemas/ReleaseConfig" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    DeployRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          maxLength: 512
          description: "`registry/repository@sha256:<64 hex>`. Tags are refused: a release names one image forever."
          example: ghcr.io/inedge/visitas@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        port: { type: integer, minimum: 1, maximum: 65535, description: "The port the app listens on (also set as `$PORT`). Default 8080." }
        health_path: { type: string, maxLength: 200, description: "Answers 2xx when the app is healthy. Default `/`." }
        replicas: { type: integer, minimum: 1, maximum: 10, description: Default 1. }
        env:
          type: object
          maxProperties: 100
          description: Non-secret variables. Names starting with `ODYSSEY_` are reserved.
          additionalProperties: { type: string, maxLength: 4096 }

    DeploySourceConfig:
      type: object
      additionalProperties: false
      description: The `config` part of a deployment from source (at most 256 KiB).
      properties:
        name: { type: string, maxLength: 200, description: "Names the source. Default: the uploaded file's name." }
        port: { type: integer, minimum: 1, maximum: 65535, description: "The port the app listens on (also set as `$PORT`). Default 8080." }
        health_path: { type: string, maxLength: 200, description: "Answers 2xx when the app is healthy. Default `/`." }
        replicas: { type: integer, minimum: 1, maximum: 10, description: Default 1. }
        env:
          type: object
          maxProperties: 100
          description: Non-secret variables. Names starting with `ODYSSEY_` are reserved.
          additionalProperties: { type: string, maxLength: 4096 }

    DeploymentStatus:
      type: string
      enum: [building, pending, applying, verifying, ready, failed, cancelled]

    GitRef:
      type: object
      additionalProperties: false
      description: A commit of a repository; where a source imported from git came from.
      required: [provider, repository, branch, commit, title, author]
      properties:
        provider: { type: string, enum: [github] }
        repository: { type: string, description: '"owner/name".' }
        branch: { type: string }
        commit: { type: string, description: The full SHA (40 or 64 hex characters). }
        title: { type: string, description: The first line of the commit message. }
        author: { type: string, description: The author's login, or name when it has none. }

    DeploymentStep:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, enum: [build, apply, wait_ready, promote] }
        status: { type: string, enum: [pending, running, done, failed, skipped] }

    Build:
      type: object
      additionalProperties: false
      description: The image built from an uploaded source. A finished one never changes.
      required: [id, organization_id, project_id, environment_id, source_id, status, image, error, run_id,
                 requested_by, created_at, updated_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        image:
          type: string
          description: "`repository@sha256:…` once succeeded; empty before."
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BuildFailure"
        run_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    BuildFailure:
      type: object
      additionalProperties: false
      required: [code, message, detail]
      properties:
        code:
          type: string
          enum: [UNSUPPORTED_APP, BUILD_FAILED, BUILD_TIMEOUT, SOURCE_INVALID, PUSH_FAILED, NO_BUILDER, NO_CLUSTER, SOURCE_EXPIRED, INTERNAL]
        message: { type: string, description: Plain words for the person who deployed. }
        detail: { type: string, description: The technical cause (the technical view). }
    BuildLogPage:
      type: object
      additionalProperties: false
      required: [lines, next, finished]
      properties:
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [seq, stream, text]
            properties:
              seq: { type: integer }
              stream: { type: string, enum: [prepare, build, system] }
              text: { type: string }
        next: { type: integer, description: The `after` to ask with next time. }
        finished: { type: boolean, description: The build ended and this page reaches the end of its log. }
    Deployment:
      type: object
      additionalProperties: false
      description: One attempt to make a release the one an environment serves. A finished one never changes.
      required: [id, organization_id, project_id, environment_id, release_id, image, build_id, source, status, reason, step, steps,
                 revision, previous_release_id, rollback_of, error, run_id, requested_by, created_at, updated_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        release_id:
          type: [string, "null"]
          format: uuid
          description: Null while a deployment from source builds (and when its build failed or was cancelled).
        image: { type: string, description: '"" while building.' }
        build_id:
          type: [string, "null"]
          format: uuid
          description: "The build of a deployment from source (`GET /projects/{id}/builds/{build}`); null for an image."
        source:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name, size, git]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                size: { type: integer, description: The archive's size in bytes. }
                git:
                  description: The commit the source was imported from; null for an uploaded folder.
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/GitRef"
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        reason:
          type: string
          enum: [deploy, rollback, auto_rollback]
          description: "`auto_rollback`: the platform restored the version online after a failed deployment."
        step: { type: string, enum: [build, apply, wait_ready, promote] }
        steps:
          type: array
          description: The steps this deployment goes through (`build` only for a folder).
          items: { $ref: "#/components/schemas/DeploymentStep" }
        revision: { type: integer }
        previous_release_id: { type: [string, "null"], format: uuid }
        rollback_of:
          type: [string, "null"]
          format: uuid
          description: The deployment this one undoes.
        error:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, message, detail]
              properties:
                code:
                  type: string
                  enum: [HEALTH_CHECK_FAILED, IMAGE_PULL_FAILED, APP_CRASHED, NOT_READY, APPLY_FAILED, PROMOTE_FAILED,
                         UNSUPPORTED_APP, BUILD_FAILED, BUILD_TIMEOUT, SOURCE_INVALID, PUSH_FAILED, NO_BUILDER, NO_CLUSTER,
                         SOURCE_EXPIRED, BUILD_INTERNAL]
                  description: "Step `build` fails with its build's code (`BUILD_INTERNAL`: the platform's side)."
                message: { type: string, description: Plain Spanish for whoever deploys. }
                detail: { type: string, description: "The cluster's own words (often English); \"\" when it said nothing. Show it as technical detail." }
        run_id: { type: string, format: uuid }
        requested_by: { type: string, description: '"" when the platform started it.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    DeploymentList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        page: { $ref: "#/components/schemas/Page" }

    CurrentRelease:
      type: object
      additionalProperties: false
      required: [environment_id, url, release, deployment, active]
      properties:
        environment_id: { type: string, format: uuid }
        url: { type: string, description: '"" before the first deployment.' }
        release:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Release"
        deployment:
          description: The deployment that put the current release online.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Deployment"
        active:
          description: The deployment in progress.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Deployment"

    ClusterStatus:
      type: string
      enum: [pending, active, revoked]
      description: "`pending`: waiting for its agent to enrol. `active`: enrolled. `revoked`: disconnected for good."

    Cluster:
      type: object
      additionalProperties: false
      description: A Kubernetes cluster of the organization. Its agent keeps an outbound mutual-TLS tunnel to the gateway.
      required: [id, organization_id, name, status, agent, certificate, connected, apps, token_expires_at, created_by,
                 created_at, enrolled_at, last_seen_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        status: { $ref: "#/components/schemas/ClusterStatus" }
        agent:
          type: object
          additionalProperties: false
          description: What its agent said when it last connected (empty before).
          required: [version, capabilities]
          properties:
            version: { type: string }
            capabilities:
              type: object
              additionalProperties: false
              required: [kubernetes_version, apis, ingress_classes, storage_classes]
              properties:
                kubernetes_version: { type: string }
                apis: { type: array, items: { type: string } }
                ingress_classes: { type: array, items: { type: string } }
                storage_classes: { type: array, items: { type: string } }
        certificate:
          type: object
          additionalProperties: false
          description: The client certificate its agent holds now.
          required: [serial, expires_at]
          properties:
            serial: { type: string, description: '"" before enrolment.' }
            expires_at: { type: [string, "null"], format: date-time }
        connected: { type: boolean, description: Its agent's tunnel is up and was heard from in the last 90 s. }
        apps: { type: integer, minimum: 0, description: Apps placed on it (a revocation leaves them running there unless moved). }
        token_expires_at:
          type: [string, "null"]
          format: date-time
          description: When the pending enrolment token stops working; null when none is pending.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        enrolled_at: { type: [string, "null"], format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    ClusterCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: Unique among the organization's clusters not revoked. }

    ClusterRevoke:
      type: object
      additionalProperties: false
      properties:
        move_to:
          type: [string, "null"]
          format: uuid
          description: Another active cluster to move the apps to; absent or null leaves them where they run.

    ClusterMove:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, format: uuid, description: The active cluster the apps go to. }

    ClusterMoved:
      type: object
      additionalProperties: false
      required: [environment_ids, apps]
      properties:
        environment_ids: { type: array, items: { type: string, format: uuid } }
        apps: { type: integer, minimum: 0 }

    EnrollmentToken:
      type: object
      additionalProperties: false
      description: Everything the agent needs to enrol, shown once.
      required: [token, expires_at, gateway, ca_pin]
      properties:
        token: { type: string, description: "`odyssey-enroll-…`: one use, 24 h." }
        expires_at: { type: string, format: date-time }
        gateway: { type: string, description: "`host:port` the agent dials." }
        ca_pin: { type: string, description: "`sha256:<hex>` of the fleet CA's public key; the agent trusts only it." }

    ClusterCreated:
      type: object
      additionalProperties: false
      required: [cluster, enrollment]
      properties:
        cluster: { $ref: "#/components/schemas/Cluster" }
        enrollment: { $ref: "#/components/schemas/EnrollmentToken" }

    ClusterList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Cluster" }
        page: { $ref: "#/components/schemas/Page" }

    AuditEntry:
      type: object
      additionalProperties: false
      description: One domain event, hash-chained to the previous entry of the organization.
      required: [id, organization_id, seq, type, version, actor_id, client, subject, summary, payload,
                 correlation_id, causation_id, occurred_at, recorded_at, prev_hash, hash]
      properties:
        id: { type: string, format: uuid, description: The event's id. }
        organization_id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1, description: Position in the organization's chain. }
        type: { type: string, examples: [project.created] }
        version: { type: integer, minimum: 1 }
        actor_id: { type: string, description: 'The user who caused it; "" for the system.' }
        client: { type: string, description: 'Channel: "web", "mcp:<client>", "cli", "" for the system.' }
        subject: { type: string, examples: ["project/00000000-0000-4000-8000-000000000000"] }
        summary: { type: string, description: Plain Spanish, for people. }
        payload: { type: object, description: The event's versioned payload (golden contracts per type). }
        correlation_id: { type: string }
        causation_id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        prev_hash: { type: string }
        hash: { type: string }

    AuditEntryList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        page: { $ref: "#/components/schemas/Page" }

    AuditVerification:
      type: object
      additionalProperties: false
      required: [valid, entries, broken_at]
      properties:
        valid: { type: boolean }
        entries: { type: integer, minimum: 0 }
        broken_at:
          type: [integer, "null"]
          description: The first entry whose hash or link does not match; null when valid.

    GitHubInfo:
      type: object
      additionalProperties: false
      required: [enabled, slug]
      properties:
        enabled: { type: boolean, description: The GitHub App is configured on this Odyssey. }
        slug: { type: string, description: 'The App''s name in URLs (`github.com/apps/<slug>`); "" when disabled.' }

    GitHubInstallURL:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, description: Where to send the browser, with a signed state. }

    GitHubInstallation:
      type: object
      additionalProperties: false
      description: An installation of Odyssey's GitHub App on a GitHub account, linked to the organization.
      required: [id, organization_id, external_id, account, account_type, all_repositories, suspended, linked_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        external_id: { type: integer, format: int64, description: GitHub's installation id. }
        account: { type: string, description: The GitHub login it is installed on. }
        account_type: { type: string, description: "`User` or `Organization`." }
        all_repositories: { type: boolean, description: Installed on every repository of the account (else on the ones chosen there). }
        suspended: { type: boolean }
        linked_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GitHubInstallationClaimed:
      type: object
      additionalProperties: false
      required: [installation, return_to]
      properties:
        installation: { $ref: "#/components/schemas/GitHubInstallation" }
        return_to: { type: string, description: The console path to go back to (starts with `/`). }

    ClaimGitHubInstallation:
      type: object
      additionalProperties: false
      required: [claim]
      properties:
        claim: { type: string, minLength: 1, maxLength: 2048, description: The `github_claim` the setup callback put in the console URL. }

    GitHubInstallationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }

    GitHubRepository:
      type: object
      additionalProperties: false
      required: [id, full_name, default_branch, private, installation_id]
      properties:
        id: { type: integer, format: int64, description: "GitHub's numeric id; survives a rename or transfer." }
        full_name: { type: string, description: '"owner/name".' }
        default_branch: { type: string }
        private: { type: boolean }
        installation_id: { type: string, format: uuid, description: The linked installation that reaches it. }

    GitHubRepositoryList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepository" }
        page: { $ref: "#/components/schemas/Page" }

    GitHubBranch:
      type: object
      additionalProperties: false
      required: [name, commit]
      properties:
        name: { type: string }
        commit: { type: string, description: The SHA of the branch head. }

    GitHubBranchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubBranch" }

    RepositoryConnection:
      type: object
      additionalProperties: false
      description: A project's repository, the branch that publishes it and how the result runs. One per project; publishes to production.
      required: [id, organization_id, project_id, installation_id, repository_id, repository, branch, root, config, last_commit, connected_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        repository_id: { type: integer, format: int64, description: GitHub's numeric repository id. }
        repository: { type: string, description: '"owner/name" as of the last (re)connect (repository_id survives a rename).' }
        branch: { type: string }
        root: { type: string, description: 'The app''s folder inside the repository; "" for its root.' }
        config: { $ref: "#/components/schemas/ReleaseConfig" }
        last_commit: { type: string, description: 'The newest commit seen on the branch; "" before the first.' }
        connected_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectRepository:
      type: object
      additionalProperties: false
      required: [installation_id, repository_id]
      properties:
        installation_id: { type: string, format: uuid, description: A linked installation of the organization. }
        repository_id: { type: integer, format: int64, minimum: 1, description: GitHub's numeric repository id. }
        branch: { type: string, maxLength: 255, description: 'Empty (default) takes the repository''s default branch.' }
        root:
          type: string
          maxLength: 200
          description: 'The app''s folder inside the repository, relative, without `.` or `..` parts. Default "" (the root).'
        port: { type: integer, minimum: 1, maximum: 65535, description: "The port the app listens on (also set as `$PORT`). Default 8080." }
        health_path: { type: string, maxLength: 200, description: "Answers 2xx when the app is healthy. Default `/`." }
        replicas: { type: integer, minimum: 1, maximum: 10, description: Default 1. }
        env:
          type: object
          maxProperties: 100
          description: Non-secret variables. Names starting with `ODYSSEY_` are reserved.
          additionalProperties: { type: string, maxLength: 4096 }

    PushStatus:
      type: string
      description: >-
        `queued` → `importing` → `deployed` | `failed`; `skipped` when a newer push of the same connection
        replaced it (only the newest commit is published).
      enum: [queued, importing, deployed, failed, skipped]

    PushFailure:
      type: object
      additionalProperties: false
      description: Why a push was not published.
      required: [code, message, detail]
      properties:
        code: { type: string }
        message: { type: string, description: In plain Spanish. }
        detail: { type: string, description: In the provider's words. }

    GitHubPush:
      type: object
      additionalProperties: false
      description: One commit of a connection to publish. A commit is published once per connection, whatever reported it.
      required: [id, organization_id, project_id, connection_id, git, trigger, status, deployment_id, error, requested_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        git: { $ref: "#/components/schemas/GitRef" }
        trigger:
          type: string
          description: "`webhook`: GitHub said the branch moved. `reconcile`: the poll found the branch ahead. `manual`: someone published now (or connected the repository)."
          enum: [webhook, reconcile, manual]
        status: { $ref: "#/components/schemas/PushStatus" }
        deployment_id:
          description: The deployment it became (`deployed` only).
          oneOf:
            - type: "null"
            - { type: string, format: uuid }
        error:
          description: Why it failed (`failed` only).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PushFailure"
        requested_by: { type: string, description: '"" for a webhook or the poll, else the user''s id.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GitHubPushList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubPush" }
        page: { $ref: "#/components/schemas/Page" }
