openapi: 3.1.0
info:
  title: Odyssey API
  version: 0.1.0
  summary: Control plane of Odyssey (Odicea), the governed platform to ship internal apps.
  description: |
    The HTTP contract of `odyssey-api`. Written by hand; `docs/api.md` holds the
    rules every endpoint follows (statuses, errors, lists, PATCH semantics) and
    this file the exact shapes.

    Guarded by `internal/bootstrap/openapi_test.go`:
    - every route the server mounts is documented here and every operation here
      is mounted (no undocumented or phantom endpoints);
    - every operation's `x-permissions` is exactly what the route enforces;
    - real responses (successes and errors) validate against these schemas.

    The console's TypeScript types are generated from this file
    (`make api-types` → `frontend/src/lib/openapi.gen.ts`).

    Compatibility (docs/api.md §8): additive changes only within `/api/v1`.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: platform
    description: Health and public configuration (no token).
  - name: projects
    description: A project groups everything a team ships. The console calls it an "app".
  - name: deployments
    description: What runs in each environment - publishing, progress, history and going back.
  - name: resources
    description: An app's databases, caches and file volumes, and their connection to the app.
  - name: clusters
    description: The organization's Kubernetes clusters, where apps run (TI's Infraestructura → Clústeres).
  - name: audit
    description: The organization's tamper-evident activity trail.
  - name: policy
    description: IT's rules (CEL) that allow, block or ask approval for actions on apps.
  - name: approvals
    description: Actions IT's rules hold until someone with the permission approves them.
  - name: inventory
    description: What the organization runs (IT's Inventario) and what needs someone's attention (Inicio).
  - name: github
    description: Connecting apps to their GitHub repositories.
  - name: access
    description: The sign-in of apps protected with an Odicea login (public routes; the OAuth flow is the proof).
  - name: mcp
    description: The endpoint coding agents use (Model Context Protocol), with its own OAuth resource.

paths:
  /health:
    get:
      tags: [platform]
      operationId: health
      summary: Liveness and database reachability
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/config:
    get:
      tags: [platform]
      operationId: getPublicConfig
      summary: Sign-in settings for the console
      description: Holds no secrets; the console reads it before signing in.
      security: []
      responses:
        "200":
          description: Public configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }

  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects
      description: "Order: `lower(name)`, then `id`."
      x-permissions: [odyssey:projects:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default `active`.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ProjectStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created. `Location` points at the new project.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Change a project's name or description
      description: Absent fields are unchanged; a patch that changes nothing writes nothing. The slug is immutable.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: The project after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [projects]
      operationId: archiveProject
      summary: Archive a project (idempotent)
      description: >-
        The project stops taking changes and its apps go offline: the
        deployments in progress are cancelled (reason archived) and each
        environment's cluster removes the app, asynchronously. Databases,
        caches, files and the history stay.
      x-permissions: [odyssey:projects:write]
      responses:
        "200":
          description: The archived project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/tier:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [projects]
      operationId: setProjectTier
      summary: Change an app's tier (IT)
      description: |
        How much the app matters: `sandbox`, `internal` (the default) or
        `production`. IT's rules (`/api/v1/policy/rules`) ask for it. Anyone
        with `odyssey:projects:write` creates an app; only `odyssey:projects:tier`
        moves it. The tier it already has writes nothing. Event
        `project.tier_changed`. Archived apps refuse it (`PROJECT_ARCHIVED`).
      x-permissions: [odyssey:projects:tier]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tier]
              properties:
                tier: { $ref: "#/components/schemas/ProjectTier" }
      responses:
        "200":
          description: The project after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/services:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [projects]
      operationId: listServices
      summary: List an app's services
      description: |
        The workloads the app is made of (its web, its API, a queue worker),
        in their order. Every app has at least one; an app made before
        services existed has one, `web` at `/` with all of its code. Not
        paginated (at most 8).
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The services.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [projects]
      operationId: setServices
      summary: Replace an app's services
      description: |
        The whole list, in order (1 to 8). The next version of the app takes
        it; the version online keeps running with the services it was made
        with. Names are unique, at most one service per route, and routes
        under `/_odicea` belong to the platform. The same list again writes
        nothing. Event `project.services_changed`.

        Anything but one `web` service at `/` with all of the code needs the
        cluster of every environment (or the organization's default one, for
        an environment not deployed yet) to run several services: otherwise
        422 `SERVICES_UNAVAILABLE`. Archived apps refuse it
        (`PROJECT_ARCHIVED`).
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetServicesRequest" }
      responses:
        "200":
          description: The services after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [projects]
      operationId: listEnvironments
      summary: List a project's environments
      description: "Not paginated (a project has a handful). Order: production, staging, previews, then `slug`."
      x-permissions: [odyssey:projects:read]
      parameters:
        - name: kind
          in: query
          description: Repeatable (OR).
          schema:
            type: array
            items: { $ref: "#/components/schemas/EnvironmentKind" }
          style: form
          explode: true
      responses:
        "200":
          description: The environments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [projects]
      operationId: getEnvironment
      summary: Get an environment
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/current:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [deployments]
      operationId: getCurrentRelease
      summary: What an environment serves
      description: The release online, the deployment that put it there and the one in progress. Before the first deployment every field but `environment_id` is empty.
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The environment's current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentRelease" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/deployments:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: List an environment's deployments
      description: "Order: newest first."
      x-permissions: [odyssey:deployments:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR).
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeploymentStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of deployments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [deployments]
      operationId: deploy
      summary: Publish an image or a folder
      description: |
        **An image** (`application/json`): creates a release (the image
        pinned by digest plus its configuration) and starts deploying it.

        **A folder** (`multipart/form-data`, parts in this order: `config`,
        the JSON configuration; then `source`, the folder as `.tar.gz`, at
        most 100 MiB and 20 000 files): stores it and starts a deployment that
        builds it first (status `building`, step `build`); the release is
        created when its image is ready. A build that fails fails the
        deployment with the build's code and leaves the app as it was.
        Uploaded folders count against the organization's quota (10 GiB
        compressed by default): when full, the oldest folders already built
        are dropped (their images stay); when none can be, 422
        `SOURCE_QUOTA`.

        An image is for apps of one service: while the app has several
        (`PUT …/services`) it is refused with 422 `IMAGE_NEEDS_ONE_SERVICE`
        (publish the code instead: each service is built from its own
        folder, all at once, and the version exists only if every build
        succeeds).

        Answers 202: the worker applies it, waits for its health check and
        only then makes it the environment's current release; poll the
        deployment (`Location`). A deployment in progress in the environment
        is cancelled (and its build, if it was building). If the new version
        fails once applied while another was online, the platform restores
        that one (a deployment with reason `auto_rollback`).
      x-permissions: [odyssey:deployments:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequest" }
          multipart/form-data:
            schema:
              type: object
              required: [config, source]
              properties:
                config: { $ref: "#/components/schemas/DeploySourceConfig" }
                source: { type: string, format: binary, description: The folder as tar.gz. }
            encoding:
              config: { contentType: application/json }
              source: { contentType: application/gzip }
      responses:
        "202":
          description: The deployment, pending (an image) or building (a folder). `Location` is its URL.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/deployments/{deployment}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - $ref: "#/components/parameters/Deployment"
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: Get a deployment and its progress
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/deployments/{deployment}/rollback:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - $ref: "#/components/parameters/Deployment"
    post:
      tags: [deployments]
      operationId: rollbackDeployment
      summary: Go back to this version
      description: |
        Deploys again the release of `deployment`, which must have gone live
        (`ready`). It creates a new deployment (reason `rollback`), not a new
        release. No body.
      x-permissions: [odyssey:deployments:rollback]
      responses:
        "202":
          description: The new deployment, pending. `Location` is its URL.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/settings:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [deployments]
      operationId: getEnvironmentSettings
      summary: Who can open the app
      description: |
        The environment's settings in force: revision 0 with the defaults
        (`team`) when nobody changed them. `access_login_available` is false
        when this control plane cannot serve the sign-in of protected apps
        (no signing key or login client configured); `access_protection_available`
        is false when the environment's cluster cannot protect apps yet.
        Environments published before this feature report `public` (revision 1,
        created by nobody): that is how they were served.
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentSettings" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/uses:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [deployments]
      operationId: getEnvironmentUses
      summary: What the app uses and what is missing
      description: |
        "Lo que usa esta app": who can open it, whether it can tell who is
        visiting, its databases/caches/files with their state, its secrets
        (how many, which are still to load), the AI and the internet egress its
        cluster allows, and `attention`: the closed list of things that block
        the app or are in progress, in plain Spanish, each with `who` can act.
        `attention` is empty when nothing is pending. The same data comes in
        the assistants' `get_app`.

        Each source fails on its own: when the secrets, the AI or the egress
        cannot be read now, that section is `null` and its name is in
        `unavailable` (the resources then come with the status `unknown`); the
        rest is still answered with 200. An unavailable section is unknown,
        not fine, and raises no attention.
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The uses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentUses" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/access:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    put:
      tags: [deployments]
      operationId: setEnvironmentAccess
      summary: Change who can open the app
      description: |
        Stores the mode as the environment's next settings revision (history is
        append-only; the mode already in force adds none). When a release is
        online and nothing is in progress, a deployment with reason `config`
        applies it to that release at once (`deployment`, `Location`); with a
        deployment in progress it applies the latest settings itself, or, if it
        already applied, one follows it; with no release online the settings
        are only stored (`deployment` null). Rolling back keeps the current
        settings. `public` also needs `odyssey:access:public`. Event
        `access.changed`.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/AccessMode" }
      responses:
        "202":
          description: |
            The settings stored and the deployment applying them, if one started; or
            `pending_approval` when IT's rules hold the change (nothing changed yet).
          headers:
            Location: { schema: { type: string }, description: "The config deployment, when there is one." }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccessChange"
                  - $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/env:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    patch:
      tags: [deployments]
      operationId: setEnvironmentVariables
      summary: Change the environment's plain variables
      description: |
        Sets and removes plain (non-secret) variables as the environment's next
        settings revision, applied like an access change (a `config`
        deployment when a release is online). A name that is a secret is
        refused (remove the secret first); setting a variable to the value it
        has adds no revision. Values never appear in the trail: event
        `env.changed` carries only the names. A name a connected resource defines is
        409 `VARIABLE_TAKEN`.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                set:
                  type: object
                  additionalProperties: { type: string, maxLength: 4096 }
                  maxProperties: 100
                unset:
                  type: array
                  maxItems: 100
                  items: { $ref: "#/components/schemas/SecretName" }
      responses:
        "202":
          description: The settings stored and the deployment applying them, if one started.
          headers:
            Location: { schema: { type: string }, description: "The config deployment, when there is one." }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsChange" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/resources:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [resources]
      operationId: listResources
      summary: List the environment's databases, caches and file volumes
      description: |
        Oldest first, with what the cluster reports of each (`phase`, `message`:
        preparing, ready, failed) and whether the app is connected to it. Also
        the kinds the environment's cluster can prepare (`available_kinds`).
        Passwords and data never appear: `variables` are only the names the app reads.
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The environment's resources.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, available_kinds]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Resource" }
                  available_kinds:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceKind" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [resources]
      operationId: createResource
      summary: Create a database, cache or file volume
      description: |
        Stores the resource and has the environment's cluster prepare it (the
        environment is placed on the default cluster if it had none). A cluster
        that cannot prepare the kind refuses with 422 `RESOURCES_UNAVAILABLE` and
        nothing is stored. With `connect` the app is connected in the same
        operation (the response carries the settings `revision` and the config
        `deployment_id`, when one started; 409 `VARIABLE_TAKEN` if a variable it
        defines is already in use). An environment has at most 10 resources
        (409 `RESOURCE_LIMIT`); the name is unique among them (409). Event
        `resource.created`. When IT's rules want approval for connecting it
        (`connect_resource`), nothing is provisioned: 202 `PendingApproval`,
        and the creation runs as the requester once approved.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name: { $ref: "#/components/schemas/ResourceName" }
                kind: { $ref: "#/components/schemas/ResourceKind" }
                storage_gi: { type: integer, minimum: 1, maximum: 100, description: "Size in GiB (default 1)." }
                connect:
                  type: object
                  additionalProperties: false
                  properties:
                    prefix: { $ref: "#/components/schemas/ResourcePrefix" }
      responses:
        "201":
          description: The resource created (and connected, when asked).
          headers:
            Location: { schema: { type: string }, description: The resource. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceChange" }
        "202":
          description: |
            `pending_approval` when IT's rules hold the connection that a create with
            `connect` asks for (nothing was created yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingApproval" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/resources/{name}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - $ref: "#/components/parameters/ResourceName"
    get:
      tags: [resources]
      operationId: getResource
      summary: A resource with its state
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      tags: [resources]
      operationId: resizeResource
      summary: Grow a resource
      description: |
        A resource only grows (1–100 GiB): a smaller size is 400, the same size
        changes nothing. A resource being deleted is 409 `RESOURCE_DELETING`.
        Event `resource.resized`.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storage_gi]
              properties:
                storage_gi: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: The resource at its new size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [resources]
      operationId: deleteResource
      summary: Delete a resource and its data
      description: |
        Erases the data: this cannot be undone. A resource the app is connected
        to is refused with 409 `RESOURCE_IN_USE` (disconnect it first). Answers
        202: the resource is `deleting` until the cluster confirms the erasure,
        and then it is forgotten (its name is free again). Events
        `resource.deleted` and, once confirmed, `resource.removed`.
      x-permissions: [odyssey:resources:delete]
      responses:
        "202":
          description: The resource, now deleting; or `pending_approval` when IT's rules hold the deletion.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Resource"
                  - $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/resources/{name}/connection:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - $ref: "#/components/parameters/ResourceName"
    put:
      tags: [resources]
      operationId: connectResource
      summary: Connect the app to a resource
      description: |
        The app receives the resource's variables (`DATABASE_URL`, … with the
        `prefix` before their names) as the next settings revision, applied like
        any settings change (a `config` deployment when a release is online).
        Connecting again with another prefix changes it. 409 `VARIABLE_TAKEN` if
        a variable it defines is already a plain variable, a secret or another
        resource's; 409 `RESOURCE_DELETING` for a resource being deleted.
        Event `resources.changed`.
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prefix: { $ref: "#/components/schemas/ResourcePrefix" }
      responses:
        "202":
          description: The resource connected and the deployment applying it, if one started; or `pending_approval` when IT's rules hold it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ResourceChange"
                  - $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [resources]
      operationId: disconnectResource
      summary: Disconnect the app from a resource
      description: The app stops receiving the resource's variables; the resource and its data stay. Event `resources.changed`.
      x-permissions: [odyssey:projects:write]
      responses:
        "202":
          description: The resource disconnected and the deployment applying it, if one started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceChange" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/ai:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    get:
      tags: [resources]
      operationId: getEnvironmentAI
      summary: The app's AI
      description: |
        Whether the app can use the organization's AI and how it stands. While it
        is on the app receives `OPENAI_API_KEY`, `OPENAI_BASE_URL`,
        `ANTHROPIC_API_KEY` and `ANTHROPIC_BASE_URL` (never shown here with
        values). `available` is false when the organization has no AI connected
        or the environment's cluster cannot run it (`message` says why).
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The AI of the environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AI" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [resources]
      operationId: enableEnvironmentAI
      summary: Turn the AI on for the app
      description: |
        Makes a key at the AI gateway, hands it sealed to the environment's
        cluster as the managed secret `ODICEA_AI_KEY` and wires the app's
        variables in a configuration deployment. It runs in the worker: 202 with
        `status` `enabling`. Already on (or on its way) changes nothing. 422
        `AI_UNAVAILABLE` when the organization has no AI or the cluster cannot
        run it (a cluster without a secret key answers 422
        `SECRETS_UNAVAILABLE`); 409 `VARIABLE_TAKEN` when the app defines a
        variable the AI sets. Keys still waiting to be revoked (turning off, or
        `revoke_failed`) do not block it: the new key is independent. 409 `AI_BUSY`
        is only for a rotation in progress.
        Event `ai.enabled`.
      x-permissions: [odyssey:projects:write]
      responses:
        "202":
          description: Accepted; poll the GET for `status`. Or `pending_approval` when IT's rules hold it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AI"
                  - $ref: "#/components/schemas/PendingApproval"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [resources]
      operationId: disableEnvironmentAI
      summary: Turn the AI off for the app
      description: |
        The app stops receiving the variables (a configuration deployment) and the
        keys are revoked at the gateway once the app runs without them. 202 with
        `status` `disabling`; already off answers 202 with `off`. Archiving an app
        does not revoke its key; restoring it keeps the AI. Event `ai.disabled`.
        If the gateway cannot be reached (or is not connected) the keys end as
        `revoke_failed` with a `warning` and `revoke_error` instead of staying in
        `disabling`; the app is already without the AI. Calling `DELETE` again
        retries the revocation, and a sweep retries every five minutes. Event
        `ai.revoke_failed`.
      x-permissions: [odyssey:projects:write]
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AI" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/ai/rotate:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
    post:
      tags: [resources]
      operationId: rotateEnvironmentAI
      summary: Renew the app's AI key
      description: |
        Makes a new key (the next version of `ODICEA_AI_KEY`), delivers it and
        revokes the old one once the app runs with the new one. 202 with
        `status` `rotating`. 409 `AI_NOT_ENABLED` when the AI is off; 409
        `AI_BUSY` while another change runs. Event `ai.rotated`.
      x-permissions: [odyssey:projects:write]
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AI" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - name: name
        in: path
        required: true
        schema: { $ref: "#/components/schemas/SecretName" }
    put:
      tags: [deployments]
      operationId: putEnvironmentSecret
      summary: Declare a secret
      description: |
        `managed`: records that a person must load the value (200, the secret
        in state `missing`; nothing reaches the cluster until it is loaded; a
        secret that exists already is returned as it is). `external`: reads it
        from the cluster's ClusterSecretStore (External Secrets Operator) as
        the next settings revision (202, like an access change); needs
        `odyssey:secrets:external` and a cluster with the operator and that
        store. Event `secret.changed` (`requested` | `external`).
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: { type: string, enum: [managed, external] }
                note: { type: string, maxLength: 200, description: "Managed: what the value is for." }
                store: { type: string, maxLength: 253, description: "External: the ClusterSecretStore." }
                key: { type: string, maxLength: 512, description: "External: the key in the vault." }
                property: { type: string, maxLength: 256, description: "External: the property (optional)." }
      responses:
        "200":
          description: The managed secret requested (or as it already was).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretView" }
        "202":
          description: The external secret stored and the deployment applying it, if one started.
          headers:
            Location: { schema: { type: string }, description: "The config deployment, when there is one." }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsChange" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [deployments]
      operationId: removeEnvironmentSecret
      summary: Remove a secret
      description: |
        A new settings revision without it (the cluster prunes its value), and
        any open request of that name. Removing a secret read from the
        company's vault needs `odyssey:secrets:external` too (403 otherwise).
        Event `secret.changed` (`removed`).
      x-permissions: [odyssey:projects:write]
      responses:
        "202":
          description: The settings stored and the deployment applying them, if one started.
          headers:
            Location: { schema: { type: string }, description: "The config deployment, when there is one." }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsChange" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/environments/{environment}/secrets/{name}/value:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Environment"
      - name: name
        in: path
        required: true
        schema: { $ref: "#/components/schemas/SecretName" }
    put:
      tags: [deployments]
      operationId: loadEnvironmentSecret
      summary: Load a managed secret's value (sealed in the browser)
      description: |
        Takes only ciphertext: the console seals the value to `secret_key`
        (from the settings) with HPKE, binding it to the cluster, environment, app,
        name and `version` (the secret's `next_version`: one more than the highest
        it ever had here, so a stale page cannot overwrite a newer value and a
        secret removed and added again never reuses a version; 409
        `SECRET_VERSION_CONFLICT` otherwise). Replacing a secret read from the
        company's vault needs `odyssey:secrets:external` (403). The
        control plane cannot open it; it travels to the cluster's agent, which
        opens and stores it, and is deleted when the agent answers. The
        reference becomes the next settings revision, applied like an access
        change. Fails closed: 422 `SECRET_KEY_CHANGED` when the cluster's key
        changed meanwhile, `SECRETS_UNAVAILABLE` when the cluster has no key.
        Event `secret.changed` (`loaded`).
      x-permissions: [odyssey:projects:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, key_id, sealed]
              properties:
                version: { type: integer, minimum: 1 }
                key_id: { type: string }
                sealed: { type: string, format: byte, description: "base64 of the HPKE encapsulated key + AES-256-GCM ciphertext." }
      responses:
        "202":
          description: The reference stored and the deployment applying it, if one started.
          headers:
            Location: { schema: { type: string }, description: "The config deployment, when there is one." }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsChange" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/releases/{release}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: release
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [deployments]
      operationId: getRelease
      summary: Get a release
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/builds/{build}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Build"
    get:
      tags: [deployments]
      operationId: getBuild
      summary: Get a build
      description: The image built from an uploaded source, for a deployment's `build` step.
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Build" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/builds/{build}/logs:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Build"
    get:
      tags: [deployments]
      operationId: getBuildLogs
      summary: Read a build's log
      description: |
        Lines after `after`, in order. Poll with `after` = the page's `next`
        until `finished`. Live while it builds; kept after it ends.
      x-permissions: [odyssey:deployments:read]
      parameters:
        - name: after
          in: query
          description: Return lines with a larger `seq` (0 = from the start).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: 1–1000 (larger values are clamped), default 1000.
          schema: { type: integer, minimum: 0, default: 1000 }
      responses:
        "200":
          description: A page of the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildLogPage" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters:
    get:
      tags: [clusters]
      operationId: listClusters
      summary: List the organization's clusters
      description: "Order: revoked last, then `lower(name)`, then `id`."
      x-permissions: [odyssey:clusters:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default all.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ClusterStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of clusters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [clusters]
      operationId: createCluster
      summary: Register a cluster
      description: >-
        Answers with the cluster and its one-time enrolment token, valid 24 h. The token is shown only here
        (only its hash is kept); install the agent with it. `FLEET_DISABLED` (422) when this installation has no
        gateway configured.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterCreate" }
      responses:
        "201":
          description: Created. `Location` points at the new cluster.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterCreated" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [clusters]
      operationId: getCluster
      summary: Get a cluster
      x-permissions: [odyssey:clusters:read]
      responses:
        "200":
          description: The cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/enrollment-token:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [clusters]
      operationId: issueClusterToken
      summary: Issue a new enrolment token
      description: >-
        Replaces the pending token (a lost or expired one). Enrolling an active cluster again (its agent lost its
        key) stops accepting its previous certificate. `CLUSTER_REVOKED` (422) for a revoked cluster.
      x-permissions: [odyssey:clusters:manage]
      responses:
        "200":
          description: The new token, shown only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [clusters]
      operationId: revokeCluster
      summary: Disconnect a cluster for good (idempotent)
      description: >-
        Its certificate stops being accepted and its tunnel closes at once; no app is placed there again. Apps
        already running there keep running without changes (`apps` counts them; their deployments fail with
        `CLUSTER_REVOKED` until they move) unless `move_to` names another active cluster: then they are moved
        there in the same transaction (`cluster.apps_moved`). Nothing moves on its own: the other cluster may be
        on another network or far from the apps' data. `INVALID_MOVE_TARGET` (422) refuses the whole request,
        revocation included. Revoking a revoked cluster records nothing, except the move if `move_to` is given.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterRevoke" }
      responses:
        "200":
          description: The revoked cluster.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [clusters]
      operationId: moveClusterApps
      summary: Move the apps of a revoked cluster to another
      description: >-
        Pins every environment of the revoked cluster to `to` (an active cluster of the organization), whose
        agent deploys their apps from scratch; what the old cluster reported is dropped. Moving an empty cluster
        changes nothing. `CLUSTER_NOT_REVOKED` (422) for a cluster still running them, `INVALID_MOVE_TARGET`
        (422) for a `to` that is not another active cluster.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterMove" }
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterMoved" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/clusters/{id}/egress:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [clusters]
      operationId: getClusterEgress
      summary: What the apps of a cluster may reach
      description: >-
        The cluster's egress policy and whether its agent enforces it (docs/egress.md). `state` is `applied` (the
        agent confirmed this generation), `pending` (it has not answered yet: offline, or just changed), `failed`
        (it answered with `error`) or `unsupported` (its agent does not list `odicea.egress`).
      x-permissions: [odyssey:clusters:read]
      responses:
        "200":
          description: The policy and its state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterEgress" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [clusters]
      operationId: setClusterEgress
      summary: Set what the apps of a cluster may reach
      description: >-
        Replaces the policy (idempotent: the same body twice changes nothing and records nothing). `allow` are CIDRs
        or single addresses, stored canonical and sorted; up to 100; `0.0.0.0/0` and `::/0` are refused (that is the
        `internet` mode, which keeps private ranges closed). It is sent to the agent at once (or when it
        connects) and the answer shows in `state`. `CLUSTER_REVOKED` (422) for a revoked cluster.
      x-permissions: [odyssey:clusters:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterEgressSet" }
      responses:
        "200":
          description: The new policy, usually `pending` until the agent answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterEgress" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: List the activity trail
      description: "Newest first (`seq` descending)."
      x-permissions: [odyssey:audit:read]
      parameters:
        - name: subject
          in: query
          description: One entity, `<kind>/<id>` (e.g. `project/…`).
          schema: { type: string }
        - name: type
          in: query
          description: Exact event types (repeatable, OR), e.g. `project.created`.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: correlation_id
          in: query
          description: Everything one request or workflow caused.
          schema: { type: string }
        - name: project_id
          in: query
          description: Everything about one app (the entries whose payload names it), whatever their subject.
          schema: { type: string, format: uuid }
        - name: channel
          in: query
          description: >-
            Where the actions came from: `console`, `github`, `platform`, `assistant` (any assistant),
            `assistant:<key>` (`claude_code`, `codex`, `cursor`, `vscode`, `antigravity`, `other`), or
            `unrecorded` (entries from before the channel was recorded).
          schema: { type: string, examples: [assistant:claude_code] }
        - name: from
          in: query
          description: Inclusive. A date (`YYYY-MM-DD`, UTC) or an RFC 3339 instant.
          schema: { type: string }
        - name: to
          in: query
          description: A date includes the whole day; an instant is exclusive.
          schema: { type: string }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/audit/verify:
    get:
      tags: [audit]
      operationId: verifyAuditTrail
      summary: Re-hash the organization's whole chain
      x-permissions: [odyssey:audit:read]
      responses:
        "200":
          description: Whether the trail is intact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/audit/summary:
    get:
      tags: [audit]
      operationId: summarizeAuditTrail
      summary: The last week at a glance
      description: "Entries, people and publications (`deployment.started`) by channel over the last 7 days."
      x-permissions: [odyssey:audit:read]
      responses:
        "200":
          description: The week's counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/audit/people:
    get:
      tags: [audit]
      operationId: listAuditPeople
      summary: Who appears in the trail
      description: "Most recently active first (at most 200), named from the organization's directory (empty names when it is unavailable)."
      x-permissions: [odyssey:audit:read]
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPersonList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/policy/rules:
    get:
      tags: [policy]
      operationId: listPolicyRules
      summary: List IT's rules
      description: |
        The organization's rulebook: the built-in rules first, then IT's own by
        age. The first read of an organization creates its built-in rules (five;
        a built-in added later reaches existing organizations switched off;
        docs/policy.md).
      x-permissions: [odyssey:policy:manage]
      responses:
        "200":
          description: Every rule.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PolicyRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [policy]
      operationId: createPolicyRule
      summary: Create a rule
      description: |
        `expression` is CEL over the action's input (docs/policy.md) and must
        compile to a bool: otherwise 422 `POLICY_INVALID` with the compiler's
        message. At most 100 rules (`POLICY_TOO_MANY`). Event `policy.rule_created`.
      x-permissions: [odyssey:policy:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyRuleDraft" }
      responses:
        "201":
          description: The rule created. `Location` is its URL.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyRule" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/policy/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [policy]
      operationId: replacePolicyRule
      summary: Replace a rule
      description: |
        The whole rule. A built-in rule only takes its `enabled` switch (the
        rest as it is): anything else is 422 `POLICY_BUILTIN`. An unchanged
        rule writes nothing. Event `policy.rule_updated`.
      x-permissions: [odyssey:policy:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyRuleDraft" }
      responses:
        "200":
          description: The rule after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyRule" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [policy]
      operationId: deletePolicyRule
      summary: Delete a rule
      description: "A built-in rule cannot be deleted (422 `POLICY_BUILTIN`): switch it off. Event `policy.rule_deleted`."
      x-permissions: [odyssey:policy:manage]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/policy/evaluate:
    post:
      tags: [policy]
      operationId: evaluatePolicy
      summary: Try the rules on an action (dry run)
      description: |
        What IT's rules would say about an action, and what each rule said.
        It decides nothing and writes nothing. `deny` beats `approval` beats
        `allow`; no rule matching is `allow`; a rule that cannot be evaluated
        counts at its own strength (a deny denies, an approval asks for
        approval, an allow is ignored; `error` says why). An optional `rule`
        is an unsaved candidate tried among the saved ones.
      x-permissions: [odyssey:policy:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: The decision and every rule's part in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEvaluation" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approval requests
      description: |
        What the caller may see, newest first: the requests they made, and the
        ones they could decide (they hold one of the request's approver
        permissions). Nothing else is ever listed (another organization's
        requests, or other people's that the caller cannot decide, do not exist
        for them). `mine` keeps only the caller's own; `decidable` only the
        pending ones the caller may decide now (what the console's bell counts).
        Pagination: `limit`, `offset`.
      x-permissions: []
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default all.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ApprovalStatus" }
          style: form
          explode: true
        - name: mine
          in: query
          schema: { type: boolean }
        - name: decidable
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/approvals/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Read an approval request
      description: A request the caller made or could decide; any other is 404.
      x-permissions: []
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/approvals/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [approvals]
      operationId: approveApproval
      summary: Approve a request
      description: |
        Needs ANY ONE of the request's `approvers` permissions (otherwise 403) and
        cannot be the person who asked (403 `APPROVAL_SELF`). Only a pending
        request can be decided (409 `APPROVAL_DECIDED`). A direct action is run
        again as the person who asked, with what they could do when they asked;
        if that fails the request says why in `execution_error` and the
        approval is still recorded. A deployment waiting for it goes on.
        Events `approval.approved` (and `approval.consumed`, or
        `approval.execution_failed` when the action could not run).
      x-permissions: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The request, approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/Validation" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/approvals/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [approvals]
      operationId: rejectApproval
      summary: Reject a request
      description: |
        Same rules as approving. Nothing runs; a waiting deployment is cancelled.
        Event `approval.rejected`.
      x-permissions: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The request, rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/Validation" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/approvals/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [approvals]
      operationId: cancelApproval
      summary: Take back your own pending request
      description: |
        Only the person who asked can cancel, and only while it is pending (403
        otherwise; 409 `APPROVAL_DECIDED` when it was already decided). A waiting
        deployment is cancelled. Event `approval.cancelled`.
      x-permissions: []
      responses:
        "200":
          description: The request, cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/inventory:
    get:
      tags: [inventory]
      operationId: listInventory
      summary: Everything the organization runs
      description: >-
        One row per environment of every active app, in app-name order (production first
        within an app): owner (who created it), tier, access, URL, the version online,
        what it uses, secrets, the last scan, the cluster and whether someone has
        something to do. It composes what each domain already knows and writes nothing.
        With `format=csv` it downloads every row that matches, without paging (header
        `X-Inventory-Truncated` says whether more than 500 apps were left out). Cells
        that start with `=`, `+`, `-` or `@` are prefixed with an apostrophe so a
        spreadsheet never runs them. `needs_attention=true` reads each candidate's uses,
        a few at a time (at most 500 apps). A row's `unavailable` names the parts that
        could not be read right now.
      x-permissions: [odyssey:inventory:read]
      parameters:
        - name: tier
          in: query
          description: Repeatable (OR).
          schema:
            type: array
            items: { $ref: "#/components/schemas/ProjectTier" }
          style: form
          explode: true
        - name: cluster
          in: query
          description: Only the environments that run on this cluster. If the clusters cannot be read now the answer says so in `unavailable` (never a silently empty list).
          schema: { type: string, format: uuid }
        - name: needs_attention
          in: query
          schema: { type: boolean }
        - name: format
          in: query
          description: "`json` (default) or `csv`."
          schema: { type: string, enum: [json, csv] }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of rows, or the CSV file.
          headers:
            X-Inventory-Truncated:
              description: Only with `format=csv`.
              schema: { type: string, enum: ["true", "false"] }
            X-Inventory-Unavailable:
              description: Only with `format=csv`. Comma-separated sources the filter needed and that could not be read (`clusters`, with `cluster=`); empty when all were. The CSV is then incomplete.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryPage" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/app-states:
    get:
      tags: [inventory]
      operationId: listAppStates
      summary: How apps stand
      description: >-
        For the console's app lists: per app (its production environment) what a
        visitor finds now (`status`), where it answers, who can open it as the
        cluster enforces it, and where it runs. The same facts as each app's own
        page, read in batches. Apps the organization does not have are absent; the
        order is the order asked. A version online whose latest publication failed is
        `online` (the failure is on the app's page and its people's attention list).
      x-permissions: [odyssey:projects:read, odyssey:deployments:read]
      parameters:
        - name: id
          in: query
          description: App ids. Repeatable, at most 100; none answers an empty list.
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
          style: form
          explode: true
      responses:
        "200":
          description: The states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStates" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/attention:
    get:
      tags: [inventory]
      operationId: getAttention
      summary: What needs your attention
      description: >-
        "Necesita tu atención". Everyone gets their own apps (the ones they created) with
        what the app's uses list for people, and their own requests to IT that wait, were
        rejected or could not run (`scope: mine`). Holders of `odyssey:approvals:decide`
        also get the requests waiting for their decision; holders of
        `odyssey:inventory:read` also get the apps with critical vulnerabilities, the
        publications that failed in the last 24 hours and the clusters that do not answer
        or do not apply their network policy (`scope: it`). IT's items come first, then by
        severity. Each source degrades on its own: the ones that could not be read are in
        `unavailable`, so an empty list with `unavailable` is not "all in order".
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attention" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github:
    get:
      tags: [github]
      operationId: getGitHub
      summary: Whether GitHub is available on this Odyssey
      description: Holds no secrets. `enabled` is false when the GitHub App is not configured.
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The integration's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/install:
    get:
      tags: [github]
      operationId: getGitHubInstallURL
      summary: Where to send the user to install the GitHub App
      description: >-
        The URL carries a signed state naming the organization and who asked; GitHub sends the browser back to
        `/github/setup`. `return_to` is the console path to land on afterwards (default: the GitHub settings
        page). `GITHUB_NOT_CONFIGURED` (422) when this installation has no GitHub App; 400 when `return_to` is not
        a console path.
      x-permissions: [odyssey:integrations:manage]
      parameters:
        - name: return_to
          in: query
          description: A console path (starts with a single `/`), e.g. `/apps/visitas/conectar`.
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The GitHub URL to open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallURL" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/installations:
    post:
      tags: [github]
      operationId: claimGitHubInstallation
      summary: Link the GitHub installation of a claim to the organization
      description: >-
        Second step of linking an installation. `/github/setup` (public) only checks that the GitHub user owns
        (User account) or administers (Organization admin, which needs the App's `members: read` permission) the
        installation's account, and redirects the browser to the console with a signed, 15-minute `github_claim`
        bound to the organization and to the Odyssey user who asked for the install link. The console posts it here,
        logged in. Only that user, in that organization, can redeem it: any other user or organization, a forged or
        expired claim, answers `GITHUB_STATE_INVALID` (422) without saying which. Linking again to the same
        organization refreshes the installation; `GITHUB_INSTALLATION_TAKEN` (409) when another organization has it;
        `GITHUB_NOT_CONFIGURED` (422); `GITHUB_NO_ACCESS` (404) when GitHub no longer knows it and
        `GITHUB_UNAVAILABLE` (502) when it does not answer. `return_to` is the console path to land on (default:
        the GitHub settings page).
      x-permissions: [odyssey:integrations:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimGitHubInstallation" }
      responses:
        "200":
          description: The linked installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationClaimed" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }
    get:
      tags: [github]
      operationId: listGitHubInstallations
      summary: List the GitHub installations linked to the organization
      description: "Not paginated (an organization links a handful). Order: `lower(account)`, then `id`."
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The linked installations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/installations/{installation}:
    parameters:
      - $ref: "#/components/parameters/Installation"
    delete:
      tags: [github]
      operationId: unlinkGitHubInstallation
      summary: Unlink a GitHub installation
      description: >-
        The apps connected through it stop publishing (their connections stay, marked unreachable). The
        installation itself stays on GitHub; uninstalling the App is done there.
      x-permissions: [odyssey:integrations:manage]
      responses:
        "204":
          description: Unlinked. No body.
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/github/repositories:
    get:
      tags: [github]
      operationId: listGitHubRepositories
      summary: List the repositories the linked installations reach
      description: >-
        Across every linked installation, filtered by `search` on the full name. Each item says which
        installation reaches it. `GITHUB_UNAVAILABLE` (502) when GitHub does not answer.
      x-permissions: [odyssey:projects:write]
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of repositories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubRepositoryList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /api/v1/github/installations/{installation}/repositories/{repository}/branches:
    parameters:
      - $ref: "#/components/parameters/Installation"
      - name: repository
        in: path
        required: true
        description: GitHub's numeric repository id.
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [github]
      operationId: listGitHubBranches
      summary: List a repository's branches
      description: >-
        Not paginated. `GITHUB_NO_ACCESS` (404) when the installation no longer reaches the repository or is
        suspended; `GITHUB_UNAVAILABLE` (502) when GitHub does not answer.
      x-permissions: [odyssey:projects:write]
      responses:
        "200":
          description: The branches and their heads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubBranchList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /api/v1/projects/{id}/repository:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [github]
      operationId: getProjectRepository
      summary: Get the project's connected repository
      description: 404 when the project has no repository connected.
      x-permissions: [odyssey:deployments:read]
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryConnection" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [github]
      operationId: connectProjectRepository
      summary: Connect (or reconnect) the project to a repository branch
      description: >-
        Replaces the project's connection, if any. Every push to the branch then publishes to production, and the
        branch's current head is queued to publish now (see `publishProjectRepository`). An empty `branch` takes
        the repository's default branch. Errors: `PROJECT_ARCHIVED`, `GITHUB_NOT_CONFIGURED` (422);
        `GITHUB_NO_ACCESS` (404, the installation does not reach the repository or is suspended),
        `GITHUB_BRANCH_MISSING` (404), and 404 for an installation or project that is not the organization's; 409
        on a concurrent update (retry); `GITHUB_UNAVAILABLE` (502).
      x-permissions: [odyssey:projects:write, odyssey:deployments:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepository" }
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryConnection" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }
    delete:
      tags: [github]
      operationId: disconnectProjectRepository
      summary: Disconnect the project's repository
      description: Stops publishing from it; deployments already made stay. 404 when none is connected.
      x-permissions: [odyssey:projects:write]
      responses:
        "204":
          description: Disconnected. No body.
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/projects/{id}/repository/publish:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [github]
      operationId: publishProjectRepository
      summary: Publish the branch head now
      description: >-
        Queues the head of the connected branch as a push (trigger `manual`); the commit is imported and deployed
        in the background. Optional body `{"rebuild": true}` ("Reconstruir todo"): every service is built again
        instead of reusing images of the same code. It always queues, even the last commit published (publishing it again); older
        pushes still waiting are skipped. `PROJECT_ARCHIVED` (422); `GITHUB_NO_ACCESS` (404, the installation no
        longer reaches the repository or is suspended); `GITHUB_BRANCH_MISSING` (404); 409 when the connection
        changed meanwhile or on a concurrent update (retry); `GITHUB_UNAVAILABLE` (502).
      x-permissions: [odyssey:deployments:create]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rebuild: { type: boolean, description: Build every service again (default false). }
      responses:
        "202":
          description: The push, queued. Poll `listProjectPushes` for its progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubPush" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /api/v1/projects/{id}/repository/pushes:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [github]
      operationId: listProjectPushes
      summary: List the commits published from the repository
      description: "Newest first (`created_at` descending, then `id`)."
      x-permissions: [odyssey:deployments:read]
      parameters:
        - name: status
          in: query
          description: Repeatable (OR). Default all.
          schema:
            type: array
            items: { $ref: "#/components/schemas/PushStatus" }
          style: form
          explode: true
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of pushes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubPushList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /github/setup:
    get:
      tags: [github]
      operationId: gitHubSetup
      summary: Where GitHub sends the browser after installing the App
      description: >-
        Public (the user has no Odyssey token here: the signed `state` names the organization and the Odyssey user
        who asked, and the OAuth `code` proves the GitHub user owns the installation's account: is the User account
        itself, or an active admin of the Organization, which needs the App's `members: read` permission). It links
        nothing. Always answers 302 to the console, never a body or an error page. On success:
        `<console>/administracion/github?github_claim=<claim>`, a signed 15-minute claim (carrying the return path)
        that the console posts, logged in, to `claimGitHubInstallation`. On failure:
        `<console>/administracion/github?github_error=<CODE>`, where CODE is `GITHUB_NOT_CONFIGURED`,
        `GITHUB_STATE_INVALID` (bad or expired state), `GITHUB_NOT_YOURS` (the GitHub user does not own or
        administer the installation's account), `GITHUB_NO_ACCESS` or `GITHUB_UNAVAILABLE`.
      security: []
      parameters:
        - name: installation_id
          in: query
          description: GitHub's installation id.
          schema: { type: integer, format: int64 }
        - name: code
          in: query
          description: The user's OAuth code.
          schema: { type: string }
        - name: state
          in: query
          description: The signed state from `getGitHubInstallURL`.
          schema: { type: string }
        - name: setup_action
          in: query
          description: "`install`, `update`... as GitHub reports it. Ignored."
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the console (see above).
          headers:
            Location:
              required: true
              schema: { type: string }

  /webhooks/github:
    post:
      tags: [github]
      operationId: receiveGitHubWebhook
      summary: Where GitHub delivers the App's webhooks
      description: >-
        Public: the only proof is the HMAC-SHA256 signature of the exact body in `X-Hub-Signature-256` (401 when it
        does not hold; checked before anything else). Answers `202 {"status":"accepted"}` for everything it
        understood, including a delivery it had seen (`X-GitHub-Delivery` is remembered 7 days) and the events it
        ignores. `push` queues the new head of every connected project on that branch (once per commit);
        `installation` and `installation_repositories` refresh, suspend or unlink the installation and disconnect the
        projects whose repository was removed. 400 for a malformed delivery; `GITHUB_NOT_CONFIGURED` (422) when this
        installation has no GitHub App. Not under `/api/v1`: no token, no CORS.
      security: []
      parameters:
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: The delivery's unique id.
          schema: { type: string, maxLength: 100 }
        - name: X-GitHub-Event
          in: header
          required: true
          description: "`push`, `installation`, `installation_repositories`, `ping`... Others are accepted and ignored."
          schema: { type: string, maxLength: 100 }
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=<hex HMAC-SHA256 of the body with the App's webhook secret>`."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Accepted (also for a repeated delivery).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /uploads/{ticket}:
    put:
      tags: [deployments]
      operationId: uploadFolder
      summary: Publish a folder with an upload ticket (what deploy_folder's command calls)
      description: >-
        Public: the ticket in the path (`odu_…`, issued by the MCP tool `deploy_folder`) is the only credential, so
        no `Authorization` header is involved. The body is the folder as a raw tar.gz (`Content-Type: application/gzip`;
        `application/octet-stream` is also taken), streamed to storage, at most 100 MiB compressed (413). The ticket
        is good for one upload within 10 minutes: it is spent when this request arrives, even if the archive is then
        refused (ask `deploy_folder` for another). Starts a deployment from source exactly like
        `POST …/deployments` with a folder, with the ticket's app, environment, user and configuration, attributed
        to the MCP client that asked for the ticket. 404 for an unknown or malformed ticket; 409
        `UPLOAD_TICKET_USED` for one used already (`details.deployment_id` when known); 422 `UPLOAD_TICKET_EXPIRED`
        for one past its 10 minutes (and the business errors of publishing a folder, e.g. `PROJECT_ARCHIVED`);
        400 `SOURCE_INVALID` for an archive that is not a usable source. Not under `/api/v1`: no token, no CORS.
      security: []
      parameters:
        - name: ticket
          in: path
          required: true
          description: The upload ticket (`odu_` and 43 URL-safe base64 characters).
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: The folder was received and the deployment started (it builds in the worker).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deployment_id, status, next_step]
                properties:
                  deployment_id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/DeploymentStatus" }
                  next_step: { type: string, description: "What to do next, worded for an agent." }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/Validation" }
        "415": { $ref: "#/components/responses/Validation" }
        "422": { $ref: "#/components/responses/Business" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/assistant:
    get:
      tags: [mcp]
      operationId: getAssistant
      summary: How to connect an AI assistant to Odicea ("Conecta tu asistente")
      description: >-
        Holds no secrets and is the same for everyone. `available` is false (and `clients` empty) when the MCP
        endpoint is not enabled on this installation. `mcp_url` is the endpoint to register (the MCP audience);
        `skill` is the downloadable `odicea` skill (`GET /skills/odicea.tar.gz`, `version` changes when its files do);
        `clients` are the assistants this installation offers (`ODYSSEY_MCP_CLIENTS`, in that order; Cursor and Antigravity only
        when the OAuth client id IAMKit registered for them is configured (`IAMKIT_MCP_CLIENT_CURSOR_ID`,
        `IAMKIT_MCP_CLIENT_ANTIGRAVITY_ID`), since they cannot register themselves), each with the
        command or JSON that registers the MCP server (`install`), a one-click `install_link` where the client
        has one (VS Code, Cursor), the command that installs the skill
        (`skill_install`) and plain-Spanish `notes` on signing in.
      x-permissions: [odyssey:projects:read]
      responses:
        "200":
          description: The assistant setup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me:
    get:
      tags: [mcp]
      operationId: getMe
      summary: The signed-in person, their role and their connected assistants
      description: >-
        Any signed-in user, about themselves (`Cache-Control: no-store`). `role` is the catalog role whose
        permissions are exactly the token's (`TI`, `Builder`, `Lector`), or empty for a grant that matches none.
        `assistant` is null when this installation does not serve MCP or IAMKit could not say what is connected
        (the console then says nothing rather than "no conectado"); otherwise `connected` lists the assistants
        the user allowed at Odicea's MCP server (asked of IAMKit with the user's own token; the one used last
        first) and `can`/`cannot` word, in plain Spanish, what an assistant may do with the user's permissions
        (one sentence per group of MCP tools).
      x-permissions: []
      responses:
        "200":
          description: The caller.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/assistants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The connection's `id` from `GET /api/v1/me`.
        schema: { type: string, minLength: 1 }
    delete:
      tags: [mcp]
      operationId: disconnectAssistant
      summary: Disconnect one of the caller's assistants
      description: >-
        Ends the assistant's sessions and consent at IAMKit, for the caller only: it must sign in and be allowed
        again to reach Odicea. Only an assistant connected to Odicea's MCP server can be disconnected here; any
        other id is 404. 401 when the session expired (sign in again); 403 when IAMKit does not let this session
        manage the user's assistants (an impersonated token); 502 when IAMKit does not answer.
      x-permissions: []
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/External" }

  /.well-known/odicea-access-keys:
    get:
      tags: [access]
      operationId: getAccessKeys
      summary: The public keys the access gates verify tickets with
      description: >-
        Public (keys are public). A JWKS of Ed25519 keys (`kty: OKP`, `crv: Ed25519`, `use: sig`, `alg: EdDSA`;
        `kid` is the first 16 characters of base64url(sha256(public key))): the key signing now first, then the
        previous ones (`ODYSSEY_ACCESS_PREVIOUS_KEYS`) so gates with a cached set keep verifying through a
        rotation. `Cache-Control: public, max-age=60`. 404 `ACCESS_NOT_CONFIGURED` when this installation has no
        signing key and IAMKit access client. Not under `/api/v1`: no token, no CORS.
      security: []
      responses:
        "200":
          description: The key set.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessKeys" }
        "404": { $ref: "#/components/responses/NotFound" }

  /access/authorize:
    get:
      tags: [access]
      operationId: authorizeAccess
      summary: Where an app's access gate sends a browser that is not signed in
      description: >-
        Public: the gate of the app's cluster redirects here (docs/access.md). Looks the environment up by its id
        (the organization comes from our own records, never from the request), requires `return` to be an
        absolute URL of the environment's app: same scheme, host and port as its URL, where an explicit default port
        (`:443` on https, `:80` on http) equals none (anything else is an open redirect, refused), https unless the host is a development one (`localhost`, `*.localhost`, `127.0.0.1`,
        `*.k3d.internal`, or `ODYSSEY_ACCESS_ALLOW_HTTP=true`), and `mode` to be the one the app's cluster was last told
        (`team` or `organization`; a public app has no sign-in: refused). Then
        302s to IAMKit's sign-in (authorization code + PKCE, the confidential access client; for `team` with the
        app's organization as the hint) and sets the sealed, HttpOnly, SameSite=Lax cookie `__odicea_flow`
        (path `/access`, 10 minutes) that the callback needs. Nothing is written to the database. 404
        `ACCESS_NOT_CONFIGURED` when the sign-in is off; every other refusal is the same generic Spanish page (400),
        whether the environment exists or not.
      security: []
      parameters:
        - name: env
          in: query
          required: true
          description: The environment id (the gate's `env`).
          schema: { type: string, format: uuid }
        - name: mode
          in: query
          required: true
          schema: { type: string, enum: [team, organization] }
        - name: return
          in: query
          required: true
          description: The absolute URL the person wanted to open.
          schema: { type: string }
      responses:
        "302":
          description: To IAMKit's sign-in.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie: { schema: { type: string }, description: "`__odicea_flow`." }
        "400":
          description: >-
            The generic Spanish page «No pudimos abrir esta app. Vuelve a intentarlo desde su enlace.» for every
            refusal (unknown environment, a `return` that is not the app's, a mode the app is not served with,
            a public app): the reason is only in the server logs.
          content:
            text/html: { schema: { type: string } }
        "404":
          description: The sign-in is off (`ACCESS_NOT_CONFIGURED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "500":
          description: A failure of ours (the same generic page).
          content:
            text/html: { schema: { type: string } }

  /access/callback:
    get:
      tags: [access]
      operationId: callbackAccess
      summary: Where IAMKit sends the browser after the access sign-in
      description: >-
        Public: needs the `__odicea_flow` cookie that `authorizeAccess` set and a `state` equal to the one sealed
        in it. Exchanges the code, reads the user (UserInfo) and decides against the environment's current
        records: `team` needs the user's organization to be the app's, `organization` needs the user to belong to
        this installation's IAMKit environment; and the flow's mode must still be the one the cluster was last told (403
        otherwise). Allowed: 302 to `<scheme>://<app host>/_odicea/callback?ticket=<JWT>&return=<path>`,
        a 60-second Ed25519 ticket (claims in docs/access.md). Not allowed: a plain Spanish HTML page, 403.
        An expired or tampered flow, or a refused code: a plain HTML page, 400. The cookie is cleared either way.
        `Cache-Control: no-store`.
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: To the app's gate with the ticket.
          headers:
            Location:
              required: true
              schema: { type: string }
        "400":
          description: >-
            The generic Spanish page «No pudimos abrir esta app. Vuelve a intentarlo desde su enlace.»: the flow
            expired or is not valid, the environment or `return` is no longer the app's, the app is public now. The
            reason is only in the server logs.
          content:
            text/html: { schema: { type: string } }
        "403":
          description: This person may not open the app, or the app's access changed since the sign-in started (HTML).
          content:
            text/html: { schema: { type: string } }
        "404":
          description: The sign-in is off (`ACCESS_NOT_CONFIGURED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "502":
          description: IAMKit failed (the generic page).
          content:
            text/html: { schema: { type: string } }
        "500":
          description: A failure of ours (the generic page).
          content:
            text/html: { schema: { type: string } }

  /skills/odicea.tar.gz:
    get:
      tags: [mcp]
      operationId: getOdiceaSkill
      summary: The `odicea` skill for coding assistants (tar.gz)
      description: >-
        Public: the skill holds no secrets and the assistant's installer fetches it with `curl`. A deterministic
        tar.gz with one top directory, `odicea/` (`SKILL.md` and `references/`), built once at startup from the
        files compiled into the API. `ETag` is the skill's version (quoted); `If-None-Match` naming it (a list, `*` or a
        weak `W/"…"` validator too) answers 304.
        `Cache-Control: public, max-age=300`. Not under `/api/v1`: no token, no CORS.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The skill's archive.
          headers:
            ETag: { schema: { type: string }, description: "The skill's version, quoted." }
            Cache-Control: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "304":
          description: The client's copy is current.

  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      summary: The MCP endpoint coding agents connect to (Claude Code, Codex, VS Code, Antigravity)
      description: >-
        Model Context Protocol, Streamable HTTP transport, stateless with JSON responses (no session, no GET
        stream). Its own OAuth protected resource (RFC 9728) of IAMKit: the token must be issued for this
        resource (RFC 8707 `resource` claim, audience `<odicea>/mcp`) and IAMKit's introspection must say it is
        live. Console tokens are refused here, and these tokens are refused by `/api/v1`. Without a valid token:
        401 with `WWW-Authenticate: Bearer resource_metadata="…"`, which starts the agent's sign-in. 503 with
        `Retry-After` when IAMKit cannot be asked (fails closed). Each tool requires its own permissions
        (`tools/list` shows only those the user holds); the tools call the same operations as this API. Mounted
        only when the introspection client is configured.
      security:
        - mcp: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A JSON-RPC 2.0 message or batch (MCP).
              type: [object, array]
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: A notification or response from the client was accepted.
        "400":
          description: Malformed MCP message.
        "401":
          description: No valid token for this resource; the challenge names the metadata.
          headers:
            WWW-Authenticate:
              schema: { type: string }
        "403":
          description: The token lacks a scope the request needs.
        "503":
          description: IAMKit could not check the token; retry later.
          headers:
            Retry-After:
              schema: { type: integer }
    get:
      tags: [mcp]
      operationId: mcpStream
      summary: Not served - the endpoint is stateless (no server-initiated stream)
      description: "Always 405 with `Allow: POST`, before any token check; MCP clients probe it and fall back to POST."
      security: []
      responses:
        "405":
          description: Only POST is served.
          headers:
            Allow:
              schema: { type: string, enum: [POST] }
    delete:
      tags: [mcp]
      operationId: mcpEndSession
      summary: Not served - the endpoint is stateless (no session to end)
      description: "Always 405 with `Allow: POST`, before any token check."
      security: []
      responses:
        "405":
          description: Only POST is served.
          headers:
            Allow:
              schema: { type: string, enum: [POST] }

  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [mcp]
      operationId: mcpResourceMetadata
      summary: Protected resource metadata of /mcp (RFC 9728)
      description: Public, CORS `*`. Names IAMKit as the authorization server and the permissions as scopes.
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }
    options:
      tags: [mcp]
      operationId: mcpResourceMetadataPreflight
      summary: CORS preflight of the metadata
      security: []
      responses:
        "204":
          description: Allowed from any origin.

  /.well-known/oauth-protected-resource:
    get:
      tags: [mcp]
      operationId: mcpRootResourceMetadata
      summary: The same metadata at the root well-known path (some clients probe it first)
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }
    options:
      tags: [mcp]
      operationId: mcpRootResourceMetadataPreflight
      summary: CORS preflight of the metadata
      security: []
      responses:
        "204":
          description: Allowed from any origin.

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: IAMKit access token
      description: The organization comes only from the token (docs/api.md §1).
    mcp:
      type: http
      scheme: bearer
      bearerFormat: IAMKit access token for the /mcp resource
      description: >-
        OAuth 2.1 with IAMKit (authorization code + PKCE, RFC 8707 resource). The agent discovers it from the
        protected resource metadata; admitted clients and consent are set in IAMKit.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Environment:
      name: environment
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceName:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ResourceName" }
    Deployment:
      name: deployment
      in: path
      required: true
      schema: { type: string, format: uuid }
    Build:
      name: build
      in: path
      required: true
      schema: { type: string, format: uuid }
    Installation:
      name: installation
      in: path
      required: true
      description: The id of a linked GitHub installation (Odyssey's, not GitHub's).
      schema: { type: string, format: uuid }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: 1–100 (larger values are clamped), default 20.
      schema: { type: integer, minimum: 1, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }

  responses:
    Validation:
      description: Malformed input (also 405, 413, 415).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: No valid token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: Valid token without the required permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Missing, or another organization's.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Unique conflict (e.g. the slug) or a serialization failure (retry).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Business:
      description: Valid input that breaks a rule (`code` says which, e.g. `PROJECT_ARCHIVED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    External:
      description: An outside service (GitHub) failed or did not answer (`GITHUB_UNAVAILABLE`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Internal:
      description: Unexpected failure; the message is generic, the cause is logged with `request_id`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    PublicConfig:
      type: object
      additionalProperties: false
      required: [iam_url, client_id, environment_id]
      properties:
        iam_url: { type: string, description: "IAMKit's browser-facing base URL." }
        client_id: { type: string, description: 'Public OAuth client (code + PKCE); "" when not configured.' }
        environment_id: { type: string }

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      description: RFC 9728 protected resource metadata.
      properties:
        resource: { type: string, description: "The canonical resource URI (the tokens' audience): `<odicea>/mcp`." }
        authorization_servers: { type: array, items: { type: string }, description: IAMKit's issuer. }
        scopes_supported: { type: array, items: { type: string }, description: The permission catalog. }
        bearer_methods_supported: { type: array, items: { type: string } }
        resource_name: { type: string }
        resource_documentation: { type: string }

    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    Error:
      type: object
      additionalProperties: false
      required: [type, code, message, status_code, request_id]
      description: docs/api.md §3. Branch on `type` (closed set) and `code` (additive); never parse `message`.
      properties:
        type: { $ref: "#/components/schemas/ErrorType" }
        code: { type: string, examples: [VALIDATION, FORBIDDEN, PROJECT_ARCHIVED] }
        message: { type: string }
        status_code: { type: integer }
        details:
          type: object
          description: Present on some 4xx (e.g. `field`); never on 5xx.
          properties:
            field: { type: string }
          additionalProperties: true
        request_id: { type: string }

    ErrorType:
      type: string
      enum: [VALIDATION, AUTHORIZATION, NOT_FOUND, CONFLICT, BUSINESS, INTERNAL, EXTERNAL]

    Page:
      type: object
      additionalProperties: false
      required: [total, limit, offset]
      properties:
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }

    ProjectStatus:
      type: string
      enum: [active, archived]

    ProjectTier:
      type: string
      enum: [sandbox, internal, production]
      description: How much the app matters; IT's rules ask for it. New apps are `internal`.

    ServiceKind:
      type: string
      enum: [web, worker]
      description: "`web` answers HTTP (publicly under its `route`, or only inside the app with `route` empty); `worker` runs without a port (a queue consumer)."

    Service:
      type: object
      additionalProperties: false
      required: [name, kind, root, route, strip_prefix, updated_at]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9]{0,19}$"
          description: Part of the service's address inside the app and of `ODICEA_SERVICE_<NAME>_URL`.
        kind: { $ref: "#/components/schemas/ServiceKind" }
        root: { type: string, maxLength: 200, description: "Its folder in the app's code (empty: all of it)." }
        route: { type: string, maxLength: 100, description: "The path of the app's address it answers (`/`, `/api`); empty: internal (a worker, or a web only the app's services reach)." }
        strip_prefix: { type: boolean, description: "The service sees `/users` for `/api/users`." }
        updated_at: { type: string, format: date-time }

    ServiceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Service" }

    SetServicesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, pattern: "^[a-z][a-z0-9]{0,19}$" }
              kind: { $ref: "#/components/schemas/ServiceKind" }
              root: { type: string, maxLength: 200, description: "Relative folder, no `.` or `..` parts; slashes around it are trimmed." }
              route:
                type: string
                maxLength: 100
                description: "`/` or a path like `/api` (letters, digits, `. _ ~ -`); a trailing `/` is trimmed. Not under `/_odicea`. Empty for a worker or an internal web."
              strip_prefix: { type: boolean, description: "Only for a route other than `/`." }

    ReleaseService:
      type: object
      additionalProperties: false
      required: [name, kind, root, route, strip_prefix, image, port, health_path, replicas]
      description: A service as one version runs it (the app's services when the version was made).
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/ServiceKind" }
        root: { type: string }
        route: { type: string }
        strip_prefix: { type: boolean }
        image: { type: string }
        port: { type: integer, description: 0 for a worker. }
        health_path: { type: string, description: Empty for a worker. }
        replicas: { type: integer }

    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, slug, description, status, tier, created_by, updated_by, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        slug:
          type: string
          description: DNS label (no `--`), unique per organization forever; part of hostnames.
          pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
        description: { type: string, maxLength: 2000 }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        tier: { $ref: "#/components/schemas/ProjectTier" }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          description: Derived from `name` when absent (accents folded).
        description: { type: string, maxLength: 2000 }

    ProjectPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    ProjectList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        page: { $ref: "#/components/schemas/Page" }

    EnvironmentKind:
      type: string
      enum: [production, staging, preview]

    Environment:
      type: object
      additionalProperties: false
      description: Where a project runs. Every project is born with `production`.
      required: [id, organization_id, project_id, slug, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        slug:
          type: string
          description: DNS label, unique in the project; part of hostnames.
          pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        created_at: { type: string, format: date-time }

    EnvironmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Environment" }

    ReleaseConfig:
      type: object
      additionalProperties: false
      required: [port, health_path, replicas, env]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        health_path: { type: string }
        replicas: { type: integer, minimum: 1, maximum: 10 }
        env:
          type: object
          additionalProperties: { type: string }

    Release:
      type: object
      additionalProperties: false
      description: An image pinned by digest plus the configuration it runs with. Immutable.
      required: [id, organization_id, project_id, image, config, services, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        image: { type: string }
        config: { $ref: "#/components/schemas/ReleaseConfig" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ReleaseService" }
          description: The app's services as this version runs them (a rollback brings them back).
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    DeployRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          maxLength: 512
          description: "`registry/repository@sha256:<64 hex>`. Tags are refused: a release names one image forever."
          example: ghcr.io/inedge/visitas@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        message: { type: string, maxLength: 200, description: "What changed, in a short line for people (the version's name in the console). Optional." }
        port: { type: integer, minimum: 1, maximum: 65535, description: "The port the app listens on (also set as `$PORT`). Default 8080." }
        health_path: { type: string, maxLength: 200, description: "Answers 2xx when the app is healthy. Default `/`." }
        replicas: { type: integer, minimum: 1, maximum: 10, description: Default 1. }
        env:
          type: object
          maxProperties: 100
          description: Non-secret variables. Names starting with `ODYSSEY_` are reserved.
          additionalProperties: { type: string, maxLength: 4096 }

    DeploySourceConfig:
      type: object
      additionalProperties: false
      description: The `config` part of a deployment from source (at most 256 KiB).
      properties:
        name: { type: string, maxLength: 200, description: "Names the source. Default: the uploaded file's name." }
        message: { type: string, maxLength: 200, description: "What changed, in a short line for people (the version's name in the console). Optional." }
        rebuild:
          type: boolean
          description: >-
            "Reconstruir todo": build every service again even when an earlier build of the same code (same files,
            same builder) could be reused — for a newer base image or a fix outside the code. Default false: a
            service whose folder did not change reuses its image (and its scan, when it is under 7 days old).
        port: { type: integer, minimum: 1, maximum: 65535, description: "The port the app listens on (also set as `$PORT`). Default 8080." }
        health_path: { type: string, maxLength: 200, description: "Answers 2xx when the app is healthy. Default `/`." }
        replicas: { type: integer, minimum: 1, maximum: 10, description: Default 1. }
        env:
          type: object
          maxProperties: 100
          description: Non-secret variables. Names starting with `ODYSSEY_` are reserved.
          additionalProperties: { type: string, maxLength: 4096 }

    DeploymentStatus:
      type: string
      enum: [building, waiting_approval, pending, applying, verifying, ready, failed, cancelled]
      description: |
        `waiting_approval`: IT's rules ask for approval before the deployment builds
        (the first step of its workflow); it goes on when someone with the permission
        approves and is `cancelled` when they reject it, it expires or the requester
        takes it back (the event `deployment.cancelled` says which).

    PendingApproval:
      type: object
      additionalProperties: false
      description: |
        The answer (202) of an action IT's rules hold for approval: nothing happened
        yet. Approving runs it again as the person who asked.
      required: [status, request_id, message]
      properties:
        status: { type: string, enum: [pending_approval] }
        request_id: { type: string, format: uuid, description: "The request (`GET /api/v1/approvals/{id}`)." }
        message: { type: string, description: "What to tell the person asking, in plain Spanish." }

    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired, cancelled]

    ApprovalRule:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Approval:
      description: A request as the caller sees it (with what they may do).
      allOf:
        - $ref: "#/components/schemas/ApprovalRequest"
        - type: object
          required: [mine, can_decide]
          properties:
            mine: { type: boolean, description: The caller asked for it. }
            can_decide: { type: boolean, description: "The caller may approve or reject it now (pending, not theirs, holding one of its approvers)." }

    ApprovalDecision:
      type: object
      additionalProperties: false
      description: The whole body is optional.
      properties:
        note: { type: string, maxLength: 500, description: Why (shown to the person who asked). }

    ApprovalList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        page: { $ref: "#/components/schemas/Page" }

    ApprovalRequest:
      type: object
      description: One action held for IT's approval.
      required: [id, action, project_id, environment_id, summary, payload, requested_by, reason, rules, approvers, status,
                 decided_by, decided_at, decision_note, expires_at, consumed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [deploy, rollback, set_access, connect_resource, delete_resource, enable_ai], description: The action held. }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        summary: { type: string, description: The action as one plain Spanish sentence. }
        payload: { type: object, description: "The domain's own description of the action (what re-runs)." }
        requested_by: { type: string, pattern: "^([0-9a-f-]{36})?$", description: "Who asked; empty for the platform (a GitHub push)." }
        requested_system: { type: string, description: "Set when the platform asked (for example `github:ana`)." }
        reason: { type: string, description: "Why it was held (the rules' names), in words." }
        rules:
          type: array
          items: { $ref: "#/components/schemas/ApprovalRule" }
        approvers:
          type: array
          description: The permissions that can decide; holding ANY ONE is enough.
          items: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: string }
        expires_at: { type: string, format: date-time, description: Seven days after it was asked. }
        consumed_at: { type: [string, "null"], format: date-time, description: "When the approval was used (an approval is good for one use)." }
        execution_error: { type: string, description: "Why an approved action could not run (plain Spanish); the requester can ask again." }
        run_id: { type: string, format: uuid, description: The workflow run waiting for it (a deployment); absent for direct actions. }
        run_step: { type: string }
        created_at: { type: string, format: date-time }

    GitRef:
      type: object
      additionalProperties: false
      description: A commit of a repository; where a source imported from git came from.
      required: [provider, repository, branch, commit, title, author]
      properties:
        provider: { type: string, enum: [github] }
        repository: { type: string, description: '"owner/name".' }
        branch: { type: string }
        commit: { type: string, description: The full SHA (40 or 64 hex characters). }
        title: { type: string, description: The first line of the commit message. }
        author: { type: string, description: "The author's login, or name when it has none." }

    DeploymentStep:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, enum: [build, apply, wait_ready, promote] }
        status: { type: string, enum: [pending, running, done, failed, skipped] }

    Build:
      type: object
      additionalProperties: false
      description: The image built from an uploaded source. A finished one never changes.
      required: [id, organization_id, project_id, environment_id, source_id, status, image, error, run_id,
                 requested_by, created_at, updated_at, started_at, finished_at, scan, rebuild, reused_from]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        image:
          type: string
          description: "`repository@sha256:…` once succeeded; empty before."
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BuildFailure"
        run_id: { type: string, format: uuid }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        scan:
          description: >-
            The image's vulnerability scan (3c). null until the cluster reports it (the
            build never waits for it) and for a build that did not succeed; a succeeded
            build ends up with one, even when it could not be done (see `error`).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BuildScan"
        rebuild: { type: boolean, description: It was asked never to reuse an earlier image ("Reconstruir todo"). }
        reused_from:
          type: [string, "null"]
          format: uuid
          description: >-
            The earlier build of the same code (same files, same builder) whose image this one reused instead of
            building: `image` is that image. Null when it built.
    BuildScan:
      type: object
      additionalProperties: false
      required: [digest, critical, high, medium, low, tool, db_updated_at, error, scanned_at]
      properties:
        digest: { type: string, description: The scanned image's digest (always the build's own). }
        critical: { type: integer, minimum: 0 }
        high: { type: integer, minimum: 0 }
        medium: { type: integer, minimum: 0 }
        low: { type: integer, minimum: 0 }
        tool: { type: string, description: 'The scanner and its version ("trivy 0.76.2").' }
        db_updated_at: { type: string, description: When the scanner's vulnerability database was built (RFC 3339; empty when unknown). }
        error:
          type: string
          description: >-
            Why the image could not be scanned, in plain Spanish; empty when it was. With an
            error the counts mean nothing and IT's rules see `scan.known = false`.
        scanned_at: { type: string, format: date-time }
    BuildFailure:
      type: object
      additionalProperties: false
      required: [code, message, detail]
      properties:
        code:
          type: string
          enum: [UNSUPPORTED_APP, BUILD_FAILED, BUILD_TIMEOUT, SOURCE_INVALID, PUSH_FAILED, NO_BUILDER, NO_CLUSTER, SOURCE_EXPIRED, SOURCE_ROOT_MISSING, INTERNAL]
        message: { type: string, description: Plain words for the person who deployed. }
        detail: { type: string, description: The technical cause (the technical view). }
    BuildLogPage:
      type: object
      additionalProperties: false
      required: [lines, next, finished]
      properties:
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [seq, stream, text]
            properties:
              seq: { type: integer }
              stream: { type: string, enum: [prepare, build, system] }
              text: { type: string }
        next: { type: integer, description: The `after` to ask with next time. }
        finished: { type: boolean, description: The build ended and this page reaches the end of its log. }
    AccessMode:
      type: string
      enum: [team, organization, public]
      description: |
        Who can open the app: `team` (people of the app's organization, the
        default), `organization` (anyone in the company's IAMKit environment) or
        `public` (anyone with the link; needs `odyssey:access:public` to set).
    SettingsAI:
      type: object
      additionalProperties: false
      description: Whether the app uses the AI gateway in this settings revision, and the version of its key the cluster must hold (never the key).
      required: [enabled, key_version]
      properties:
        enabled: { type: boolean }
        key_version: { type: integer }
        key_id: { type: string }
        base_url: { type: string }
    EnvironmentSettings:
      type: object
      additionalProperties: false
      required: [revision, access, env, resources, secrets, ai, secret_key, external_secrets, secret_stores, secrets_cluster_revoked, access_login_available, access_protection_available]
      properties:
        revision: { type: integer, description: "0: the defaults; every change adds one." }
        ai: { $ref: "#/components/schemas/SettingsAI" }
        access:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { $ref: "#/components/schemas/AccessMode" }
        env: { $ref: "#/components/schemas/EnvironmentVariables" }
        resources:
          type: array
          description: The resources the app is connected to, by name.
          items: { $ref: "#/components/schemas/ResourceUse" }
        secrets:
          type: array
          description: The environment's secrets judged against its cluster, then the open requests (state `missing`), by name.
          items: { $ref: "#/components/schemas/SecretView" }
        secret_key:
          description: >-
            The cluster key a managed value is sealed to in the browser (pkg/secretbox; HPKE DHKEM-X25519,
            HKDF-SHA256, AES-256-GCM). Null when the environment has no cluster or its cluster cannot take
            managed secrets yet.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ClusterSecretKey"
        external_secrets: { type: boolean, description: "Whether the cluster has the External Secrets Operator." }
        secret_stores:
          type: array
          description: The cluster's ClusterSecretStores an external secret can read from.
          items: { type: string }
        secrets_cluster_revoked:
          type: boolean
          description: >-
            True when the environment's cluster was revoked: that is why it offers no key nor stores
            (IT moves the environment to another cluster).
        access_login_available: { type: boolean }
        access_protection_available:
          type: boolean
          description: >-
            Whether the environment's cluster can protect apps with the sign-in (its agent lists `odicea.access`).
            An environment not placed yet is judged by the organization's default cluster; false with no cluster.
            When false only `public` can be applied there.
    EnvironmentVariables:
      type: object
      description: >-
        Plain (non-secret) variables of the environment. They win over a release's env of the same name;
        a secret of the same name wins over both. Names starting with `ODYSSEY_` are reserved.
      additionalProperties: { type: string }
    SettingsRevision:
      type: object
      additionalProperties: false
      required: [revision, access, env, resources, secrets, ai]
      description: One revision of an environment's configuration (only references to secrets, never a value).
      properties:
        revision: { type: integer }
        ai: { $ref: "#/components/schemas/SettingsAI" }
        access:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { $ref: "#/components/schemas/AccessMode" }
        env: { $ref: "#/components/schemas/EnvironmentVariables" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/ResourceUse" }
        secrets:
          type: array
          items: { $ref: "#/components/schemas/SecretRef" }
    SettingsChange:
      type: object
      additionalProperties: false
      required: [settings, deployment]
      properties:
        settings: { $ref: "#/components/schemas/SettingsRevision" }
        deployment:
          description: The config deployment applying the change (null when none started).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Deployment"
    ResourceName:
      type: string
      pattern: "^[a-z]([a-z0-9-]*[a-z0-9])?$"
      maxLength: 30
      description: Lowercase letters, digits and hyphens; unique among the environment's resources.
    ResourcePrefix:
      type: string
      pattern: "^[A-Z]([A-Z0-9_]*[A-Z0-9])?$"
      maxLength: 40
      description: Goes before the variable names (`ANALYTICS` → `ANALYTICS_DATABASE_URL`); empty for none.
    ResourceKind:
      type: string
      enum: [postgres, redis, files]
      description: "`postgres` (variables `DATABASE_URL`, `PGHOST`, …), `redis` (`REDIS_URL`), `files` (`FILES_DIR`)."
    EnvironmentUses:
      type: object
      additionalProperties: false
      required: [access, identity, resources, secrets, variables, ai, egress, unavailable, attention]
      properties:
        access:
          type: object
          additionalProperties: false
          required: [mode, pending, failed]
          properties:
            mode: { type: string, enum: [team, organization, public] }
            pending: { type: boolean, description: "The mode (or another setting) is stored but the app online has not received it yet; a config deployment is on its way or failed." }
            failed: { type: boolean, description: "The settings were not applied and nothing is retrying; saving the change again retries (`config_failed` attention, who `owner`)." }
        identity:
          type: object
          additionalProperties: false
          required: [verifiable]
          properties:
            verifiable: { type: boolean, description: "The app receives the signed `X-Odicea-Assertion` header (modes `team` and `organization`)." }
        resources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, kind, prefix, status, variables]
            properties:
              name: { $ref: "#/components/schemas/ResourceName" }
              kind: { $ref: "#/components/schemas/ResourceKind" }
              prefix: { type: string }
              status:
                type: string
                enum: [ready, preparing, failed, deleting, unknown]
                description: "`unknown`: the resource domain could not be asked now (see `unavailable`)."
              detail: { type: string, description: What the cluster said (why it failed). }
              variables: { type: array, items: { type: string }, description: The environment variables the app reads it by. }
        secrets:
          type: [object, "null"]
          additionalProperties: false
          description: "`null` when it could not be read now (listed in `unavailable`)."
          required: [total, missing, external, unavailable]
          properties:
            total: { type: integer }
            missing: { type: array, items: { type: string }, description: "Names the app does not receive yet (no value loaded, or it must be loaded again because the cluster's key changed)." }
            external: { type: integer, description: How many are read from the company's vault. }
            unavailable: { type: integer, description: "How many cannot reach the app for now whatever people do (the cluster cannot receive private data, or the vault could not be read); it is for IT." }
        variables: { type: integer, description: Plain (non-secret) variables of the app. }
        ai:
          type: [object, "null"]
          additionalProperties: false
          description: "`null` when it could not be read now (listed in `unavailable`)."
          required: [available, enabled, status]
          properties:
            available: { type: boolean }
            enabled: { type: boolean }
            status: { type: string, enum: [off, enabling, enabled, rotating, disabling, revoke_failed] }
        egress:
          type: [object, "null"]
          additionalProperties: false
          description: "`null` when it could not be read now (listed in `unavailable`)."
          required: [mode, state, enforced]
          properties:
            mode: { type: string, description: "`internet` or `restricted`; empty when the app has no cluster." }
            state: { type: string, description: "`applied`, `pending`, `failed` or `unsupported`; empty when the app has no cluster." }
            enforced: { type: boolean }
        unavailable:
          type: array
          description: Sections that could not be read now. Their content is unknown (not fine) and raises no attention; ask again in a moment.
          items:
            type: string
            enum: [resources, secrets, ai, egress]
        attention:
          type: array
          description: |
            What blocks the app or is in progress, a closed list. `who` says who
            can act: `owner` (the people of the app: load a secret, save a
            change again), `it` (only IT: the cluster, the AI, a failed
            resource; the console says "Pide a TI que lo revise" because IT is
            not notified yet) or `wait` (in progress, nothing to do). An app
            needs people when any item has a `who` other than `wait`.
          items:
            type: object
            additionalProperties: false
            required: [kind, who, message]
            properties:
              kind:
                type: string
                enum: [secret_missing, secrets_unavailable, resource_not_ready, resource_failed, ai_error, ai_pending, config_pending, config_failed, egress_not_applied]
              who:
                type: string
                enum: [owner, it, wait]
              message: { type: string, description: "What is going on, in plain Spanish." }
    ResourceUse:
      type: object
      additionalProperties: false
      required: [name, kind]
      description: A resource the app is connected to (in a settings revision).
      properties:
        name: { $ref: "#/components/schemas/ResourceName" }
        kind: { $ref: "#/components/schemas/ResourceKind" }
        prefix: { type: string }
    Resource:
      type: object
      required: [id, organization_id, project_id, environment_id, name, kind, storage_gi, generation, status, created_by, created_at, updated_at, phase, message, connected, prefix, variables]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/ResourceName" }
        kind: { $ref: "#/components/schemas/ResourceKind" }
        storage_gi: { type: integer, description: Size in GiB; it only grows. }
        generation: { type: integer, description: Grows with every change; the cluster ignores an older one. }
        status:
          type: string
          enum: [active, deleting]
          description: "`deleting` until the cluster confirms the data erased; then the resource is forgotten."
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        phase:
          type: string
          enum: [provisioning, ready, failed, deleted]
          description: What the cluster reports (`provisioning` also while it has reported nothing yet).
        message: { type: string, description: "Why it failed, when it did." }
        connected: { type: boolean, description: Whether the app receives the resource's variables. }
        prefix: { type: string, description: The connection's prefix ("" for none). }
        variables:
          type: array
          description: The variable names the app reads the resource by (never their values).
          items: { type: string }
    AI:
      type: object
      required: [available, enabled, status, base_url, variables, enabled_by, enabled_at]
      properties:
        available: { type: boolean, description: Whether the AI can be turned on here (the gateway is connected and the cluster can run it). }
        message: { type: string, description: "Why it is not available, when it is not." }
        enabled: { type: boolean, description: Whether the app's settings carry the AI. }
        status:
          type: string
          enum: [off, enabling, enabled, rotating, disabling, revoke_failed]
          description: "`revoke_failed`: the app no longer has the AI but a key could not be revoked at the gateway (see `warning`); a new `DELETE` retries it and a sweep retries it on its own."
        base_url: { type: string, description: The gateway as apps reach it (without `/v1`). }
        variables:
          type: array
          description: The variable names the app reads the AI by (never their values).
          items: { type: string }
        enabled_by: { type: [string, "null"], format: uuid }
        enabled_at: { type: [string, "null"], format: date-time }
        warning: { type: string, description: "Set while a key could not be revoked at the gateway: \"No se pudo revocar la llave en el gateway de IA; TI debe revisarlo.\" It stays until the revocation succeeds (also when the app has the AI on again with a new key)." }
        revoke_error: { type: string, description: Why the revocation failed (for IT; never a key). }
    ResourceChange:
      description: A resource plus what a connection change stored.
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [revision, deployment_id]
          properties:
            revision: { type: integer, description: "The settings revision in force after the change (0: the environment has never had settings)." }
            deployment_id:
              description: The config deployment applying the connection (null when none started).
              oneOf:
                - type: "null"
                - { type: string, format: uuid }
    SecretName:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
      description: An environment variable name; names starting with `ODYSSEY_` are reserved.
    SecretRef:
      type: object
      additionalProperties: false
      required: [name, source]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        source:
          type: string
          enum: [managed, external]
          description: "`managed`: a person loads the value in the console; `external`: read from the company's vault."
        version: { type: integer, description: "Managed: 1 for the first load, +1 per rotation (absent: not loaded)." }
        key_id: { type: string, description: "Managed: the cluster key the value was sealed to." }
        loaded_by: { type: string, format: uuid }
        loaded_at: { type: string, format: date-time }
        store: { type: string, description: "External: the cluster's ClusterSecretStore." }
        key: { type: string, description: "External: the key in the vault." }
        property: { type: string, description: "External: the property of the key (optional)." }
    SecretView:
      type: object
      additionalProperties: false
      required: [name, source, state, next_version]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        source: { type: string, enum: [managed, external] }
        version: { type: integer }
        key_id: { type: string }
        loaded_by: { type: string, format: uuid }
        loaded_at: { type: string, format: date-time }
        store: { type: string }
        key: { type: string }
        property: { type: string }
        state:
          type: string
          enum: [missing, loaded, reload, external, unavailable, failed]
          description: >-
            `missing`: requested, nobody loaded it yet; `loaded`: in force; `reload`: sealed to a key the
            environment's cluster no longer has (load it again); `external`: read from the vault;
            `unavailable`: the cluster cannot take this kind of secret; `failed`: the value in force never
            reached the cluster (see `failure`; load it again).
        next_version:
          type: integer
          minimum: 1
          description: >-
            The version a value loaded now must be sealed for (`PUT …/value`): one more than the highest this
            name ever had in the environment, also after it was removed (the cluster takes only newer versions).
        failure:
          type: object
          additionalProperties: false
          required: [version, error, failed_at]
          description: Why the value in force did not arrive (state `failed`).
          properties:
            version: { type: integer }
            error: { type: string, maxLength: 500 }
            failed_at: { type: string, format: date-time }
        request: { $ref: "#/components/schemas/SecretRequest" }
    SecretRequest:
      type: object
      additionalProperties: false
      required: [name, note, requested_by, requested_via, created_at]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        note: { type: string, maxLength: 200 }
        requested_by: { type: string, format: uuid }
        requested_via: { type: string }
        created_at: { type: string, format: date-time }
    ClusterSecretKey:
      type: object
      additionalProperties: false
      required: [cluster_id, key_id, public_key, app]
      properties:
        cluster_id: { type: string, format: uuid }
        app: { type: string, description: "The app (its name in the cluster) a value sealed now is bound to." }
        key_id: { type: string, description: "base64url(sha256(public_key)) cut to 16 characters." }
        public_key: { type: string, format: byte, description: "The X25519 public key, base64." }
    AccessChange:
      type: object
      additionalProperties: false
      required: [settings, deployment, access_login_available]
      properties:
        settings: { $ref: "#/components/schemas/SettingsRevision" }
        deployment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Deployment"
        access_login_available: { type: boolean }
    Deployment:
      type: object
      additionalProperties: false
      description: One attempt to make a release the one an environment serves. A finished one never changes.
      required: [id, organization_id, project_id, environment_id, release_id, image, build_id, source, builds, rebuild, status, reason, step, steps,
                 revision, previous_release_id, rollback_of, settings_revision, error, run_id, requested_by, requested_by_name, requested_via, message, created_at, updated_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        release_id:
          type: [string, "null"]
          format: uuid
          description: Null while a deployment from source builds (and when its build failed or was cancelled).
        image: { type: string, description: '"" while building.' }
        build_id:
          type: [string, "null"]
          format: uuid
          description: "The build of a deployment from source (`GET /projects/{id}/builds/{build}`): its first service's when the app has several (see `builds`); null for an image."
        builds:
          type: array
          maxItems: 8
          description: |
            A deployment from source builds each service of the app from its own folder, all at once: the services as
            they were when it was asked for (its version is made of exactly these) and the build of each. The version
            exists only if every build succeeds. Empty for an image and for deployments made before apps had services.
          items:
            type: object
            additionalProperties: false
            required: [name, kind, root, route, strip_prefix, build_id]
            properties:
              name: { type: string }
              kind: { $ref: "#/components/schemas/ServiceKind" }
              root: { type: string, description: The folder of the code it is built from ("" = all of it). }
              route: { type: string }
              strip_prefix: { type: boolean }
              build_id: { type: string, format: uuid }
        rebuild:
          type: boolean
          description: Its builds were asked never to reuse an earlier image ("Reconstruir todo").
        source:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name, size, git]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                size: { type: integer, description: The archive's size in bytes. }
                git:
                  description: The commit the source was imported from; null for an uploaded folder.
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/GitRef"
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        reason:
          type: string
          enum: [deploy, rollback, auto_rollback, config]
          description: |
            `auto_rollback`: the platform restored the version online after a failed deployment.
            `config`: the same release again, to apply new settings (who can open it).
        step: { type: string, enum: [build, apply, wait_ready, promote] }
        steps:
          type: array
          description: The steps this deployment goes through (`build` only for a folder).
          items: { $ref: "#/components/schemas/DeploymentStep" }
        revision: { type: integer }
        previous_release_id: { type: [string, "null"], format: uuid }
        rollback_of:
          type: [string, "null"]
          format: uuid
          description: The deployment this one undoes.
        settings_revision:
          type: [integer, "null"]
          description: The environment settings revision its apply step handed to the cluster (null until then, and before settings existed).
        error:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, message, detail]
              properties:
                code:
                  type: string
                  enum: [HEALTH_CHECK_FAILED, IMAGE_PULL_FAILED, APP_CRASHED, NOT_READY, APPLY_FAILED, RESOURCE_NOT_READY, PROMOTE_FAILED,
                         UNSUPPORTED_APP, BUILD_FAILED, BUILD_TIMEOUT, SOURCE_INVALID, PUSH_FAILED, NO_BUILDER, NO_CLUSTER,
                         SOURCE_EXPIRED, SOURCE_ROOT_MISSING, BUILD_INTERNAL, POLICY_DENIED, SERVICES_UNAVAILABLE]
                  description: "Step `build` fails with its build's code (`BUILD_INTERNAL`: the platform's side); with several services, the message names the one that failed. `SOURCE_ROOT_MISSING`: a service's folder is not in the code. `RESOURCE_NOT_READY`: a database, cache or volume the app uses was not ready in time (step `wait_ready`). `POLICY_DENIED`: one of IT's rules refused it, before the build (step `authorize`, `step` is the first one) or right after it with the images' scan (a critical vulnerability in production; with several services, their findings added up); the message names the rule. `SERVICES_UNAVAILABLE`: the app's services changed to a list this version cannot run (several services need a cluster that runs them)."
                message: { type: string, description: Plain Spanish for whoever deploys. }
                detail: { type: string, description: "The cluster's own words (often English); \"\" when it said nothing. Show it as technical detail." }
        run_id: { type: string, format: uuid }
        requested_by: { type: string, description: '"" when the platform started it.' }
        requested_by_name:
          type: string
          description: >-
            requested_by's name in the organization's directory right after the deployment started (a snapshot: a
            later rename does not rewrite it; never an email). `""` while it is being resolved (the worker asks the
            directory after the deployment started), for the platform's own deployments, when the directory does
            not know them and for versions published before this was recorded.
        requested_via:
          type: string
          description: >-
            Who asked, set by the server (never by the caller): `console`, `assistant:<preset>` (`claude_code`,
            `codex`, `vscode`, `antigravity`, or `other`), `github` (nobody did: a push or the poll of a connected
            repository) or `platform` (the automatic restore after a failure). It follows the requester, not where
            the code lives: "Publicar ahora" from the console is `console`, from an assistant `assistant:<preset>`.
            `""` for versions published before this was recorded.
        message:
          type: string
          maxLength: 200
          description: >-
            What changed, in the words of whoever asked (the `message` of the deploy, of the folder upload or of
            the MCP `deploy_folder`/`deploy_image`): one line, control characters and runs of spaces collapsed.
            `""` when nobody said, for rollbacks, restores and access changes, and for versions published before
            this was recorded. A version from GitHub is named by its commit (`source.git.title`) instead.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    DeploymentList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        page: { $ref: "#/components/schemas/Page" }

    CurrentRelease:
      type: object
      additionalProperties: false
      required: [environment_id, url, release, deployment, active, applied_settings_revision, access]
      properties:
        environment_id: { type: string, format: uuid }
        url: { type: string, description: '"" before the first deployment.' }
        access:
          description: >-
            Who can open the release online now, as the cluster enforces it (the same answer as
            `AppState.access`); the settings say what will be. Null when nothing is online or it cannot be told.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ServingAccess"
        applied_settings_revision:
          description: >-
            The settings revision the cluster was last told (set when a deployment's apply step handed it to the
            cluster, even if that deployment then failed); null if never. Compare with the latest settings revision:
            lower means the change has not reached the app yet.
          type: [integer, "null"]
        release:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Release"
        deployment:
          description: The deployment that put the current release online.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Deployment"
        active:
          description: The deployment in progress.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Deployment"

    ServingAccess:
      type: object
      additionalProperties: false
      description: >-
        Who can open an app online: the mode the cluster was last told (what the access gate enforces), never
        merely the stored one. `pending` is a different mode saved and not applied yet.
      required: [mode, pending]
      properties:
        mode: { $ref: "#/components/schemas/AccessMode" }
        pending:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AccessMode"

    ClusterStatus:
      type: string
      enum: [pending, active, revoked]
      description: "`pending`: waiting for its agent to enrol. `active`: enrolled. `revoked`: disconnected for good."

    Cluster:
      type: object
      additionalProperties: false
      description: A Kubernetes cluster of the organization. Its agent keeps an outbound mutual-TLS tunnel to the gateway.
      required: [id, organization_id, name, status, agent, certificate, connected, apps, token_expires_at, created_by,
                 created_at, enrolled_at, last_seen_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        status: { $ref: "#/components/schemas/ClusterStatus" }
        agent:
          type: object
          additionalProperties: false
          description: What its agent said when it last connected (empty before).
          required: [version, capabilities]
          properties:
            version: { type: string }
            capabilities:
              type: object
              additionalProperties: false
              required: [kubernetes_version, apis, ingress_classes, storage_classes, resource_kinds]
              properties:
                kubernetes_version: { type: string }
                apis: { type: array, items: { type: string } }
                ingress_classes: { type: array, items: { type: string } }
                storage_classes: { type: array, items: { type: string } }
                resource_kinds:
                  type: array
                  description: The kinds of resources (`postgres`, `redis`, `files`) its agent can prepare; empty for an agent older than 2b.
                  items: { type: string }
        certificate:
          type: object
          additionalProperties: false
          description: The client certificate its agent holds now.
          required: [serial, expires_at]
          properties:
            serial: { type: string, description: '"" before enrolment.' }
            expires_at: { type: [string, "null"], format: date-time }
        connected: { type: boolean, description: Its agent's tunnel is up and was heard from in the last 90 s. }
        apps: { type: integer, minimum: 0, description: Apps placed on it (a revocation leaves them running there unless moved). }
        token_expires_at:
          type: [string, "null"]
          format: date-time
          description: When the pending enrolment token stops working; null when none is pending.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        enrolled_at: { type: [string, "null"], format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }

    ClusterCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: Unique among the organization's clusters not revoked. }

    ClusterRevoke:
      type: object
      additionalProperties: false
      properties:
        move_to:
          type: [string, "null"]
          format: uuid
          description: Another active cluster to move the apps to; absent or null leaves them where they run.

    ClusterMove:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, format: uuid, description: The active cluster the apps go to. }

    ClusterEgressSet:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [internet, restricted]
          description: "`internet` (default): the public internet plus `allow`. `restricted`: only `allow` (and what apps always reach: DNS, their own resources, the sign-in gate)."
        allow:
          type: array
          maxItems: 100
          items: { type: string, description: A CIDR (203.0.113.0/24) or a single address. }

    ClusterEgress:
      type: object
      additionalProperties: false
      required: [mode, allow, generation, acknowledged_generation, error, acknowledged_at, warnings, supported, state, enforced]
      properties:
        mode: { type: string, enum: [internet, restricted] }
        allow: { type: array, items: { type: string } }
        generation: { type: integer, minimum: 0, description: Grows with every change; 0 is the default nobody changed. }
        acknowledged_generation: { type: [integer, "null"], description: The last generation the agent answered for. }
        error: { type: string, description: What the agent said when it could not apply the acknowledged generation. }
        acknowledged_at: { type: [string, "null"], format: date-time }
        warnings:
          type: array
          maxItems: 10
          items: { type: string }
          description: What TI should review although the policy is applied, in Spanish (an `allow` entry that includes a node of the cluster; so the apps can reach its kubelet, its ports and, on a control-plane node, the Kubernetes API). Empty unless `state` is `applied`.
        supported: { type: boolean, description: Its agent lists `odicea.egress`. }
        state: { type: string, enum: [applied, pending, failed, unsupported] }
        enforced: { type: boolean, description: "`state` is `applied`." }

    ClusterMoved:
      type: object
      additionalProperties: false
      required: [environment_ids, apps]
      properties:
        environment_ids: { type: array, items: { type: string, format: uuid } }
        apps: { type: integer, minimum: 0 }

    EnrollmentToken:
      type: object
      additionalProperties: false
      description: Everything the agent needs to enrol, shown once.
      required: [token, expires_at, gateway, ca_pin]
      properties:
        token: { type: string, description: "`odyssey-enroll-…`: one use, 24 h." }
        expires_at: { type: string, format: date-time }
        gateway: { type: string, description: "`host:port` the agent dials." }
        ca_pin: { type: string, description: "`sha256:<hex>` of the fleet CA's public key; the agent trusts only it." }

    ClusterCreated:
      type: object
      additionalProperties: false
      required: [cluster, enrollment]
      properties:
        cluster: { $ref: "#/components/schemas/Cluster" }
        enrollment: { $ref: "#/components/schemas/EnrollmentToken" }

    ClusterList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Cluster" }
        page: { $ref: "#/components/schemas/Page" }

    AuditEntry:
      type: object
      additionalProperties: false
      description: One domain event, hash-chained to the previous entry of the organization.
      required: [id, organization_id, seq, type, version, actor_id, client, subject, summary, payload,
                 correlation_id, causation_id, occurred_at, recorded_at, prev_hash, hash, channel, actor_name]
      properties:
        id: { type: string, format: uuid, description: The event's id. }
        organization_id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1, description: Position in the organization's chain. }
        type: { type: string, examples: [project.created] }
        version: { type: integer, minimum: 1 }
        actor_id: { type: string, description: 'The user who caused it; "" for the platform or GitHub.' }
        client: { type: string, description: 'The raw event client: an OAuth client id (the console), "api", "mcp:<client>", "github", "platform"; "" when not recorded.' }
        channel:
          type: string
          description: 'Where it came from, derived on read (not hashed): console, github, platform, assistant:<key>; "" when not recorded.'
          examples: [assistant:claude_code]
        actor_name: { type: string, description: 'The actor''s name in the organization''s directory, derived on read (not hashed); "" when unknown.' }
        subject: { type: string, examples: ["project/00000000-0000-4000-8000-000000000000"] }
        summary: { type: string, description: "Plain Spanish, for people." }
        payload: { type: object, description: The event's versioned payload (golden contracts per type). }
        correlation_id: { type: string }
        causation_id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        prev_hash: { type: string }
        hash: { type: string }

    InventoryPage:
      type: object
      additionalProperties: false
      required: [items, page, truncated, unavailable]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryRow" }
        page: { $ref: "#/components/schemas/Page" }
        truncated:
          type: boolean
          description: The organization has more apps than one read looks at (500); the filters narrow it.
        unavailable:
          type: array
          items: { type: string, enum: [clusters] }
          description: >-
            Sources the filter needed and that could not be read now. With `cluster=` and the clusters
            (or placements) unreadable it is `["clusters"]` and `items` is empty because nothing could be
            matched, NOT because no environment runs there. Empty when everything was read.
    InventoryRow:
      type: object
      additionalProperties: false
      description: One environment of one app.
      required: [app, environment, owner, access, url, status, online, resources, ai, secrets, scan, cluster, needs_attention, attention, unavailable]
      properties:
        app:
          type: object
          additionalProperties: false
          required: [id, slug, name, tier]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            tier: { $ref: "#/components/schemas/ProjectTier" }
        environment:
          type: object
          additionalProperties: false
          required: [id, slug, kind]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            kind: { $ref: "#/components/schemas/EnvironmentKind" }
        owner: { type: string, format: uuid, description: Who created the app. }
        access:
          description: Empty when the uses could not be read (see `unavailable`).
          oneOf:
            - $ref: "#/components/schemas/AccessMode"
            - type: string
              enum: [""]
        url: { type: string, description: Where the app answers; empty before its first deployment. }
        status:
          type: string
          enum: [not_deployed, deploying, online, failed]
          description: "`failed` when the last publication failed (the previous version, if any, keeps running)."
        online:
          description: The version being served; null when nothing is.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [image, since]
              properties:
                image: { type: string }
                since: { type: [string, "null"], format: date-time }
        resources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, kind, status]
            properties:
              name: { type: string }
              kind: { $ref: "#/components/schemas/ResourceKind" }
              status: { type: string, description: "ready, provisioning, failed or unknown." }
        ai: { type: boolean, description: The app has the AI gateway enabled. }
        secrets:
          type: object
          additionalProperties: false
          required: [total, missing]
          properties:
            total: { type: integer, minimum: 0 }
            missing: { type: array, items: { type: string }, description: Keys the app asks for and nobody uploaded (names only). }
        scan:
          type: object
          additionalProperties: false
          description: The scan of the image online.
          required: [state, critical, high, scanned_at]
          properties:
            state:
              type: string
              enum: [none, pending, unknown, clean, vulnerable]
              description: >-
                `none`: nothing built here is online (an image published as it was is
                never scanned); `pending`: built, the scan is not recorded yet; `unknown`:
                it could not be done (see `error`); `clean`; `vulnerable`.
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            error: { type: string, description: Plain Spanish; only with `unknown`. }
            scanned_at: { type: [string, "null"], format: date-time }
        cluster:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        needs_attention: { type: boolean }
        attention:
          type: array
          description: What the app's uses list (the same items as the uses endpoint).
          items:
            type: object
            additionalProperties: false
            required: [kind, message, who]
            properties:
              kind: { type: string }
              message: { type: string }
              who: { type: string, enum: [owner, it, wait] }
        unavailable:
          type: array
          items: { type: string }
          description: The parts that could not be read now (scan, cluster, uses, resources, secrets, ai, egress).
    AppStates:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppState" }
    AppState:
      type: object
      additionalProperties: false
      description: How one app stands in its production environment.
      required: [app_id, status, url, since, access, cluster, unavailable, last_change]
      properties:
        app_id: { type: string, format: uuid }
        status:
          type: string
          enum: [not_deployed, waiting_approval, deploying, online, failed, archived]
          description: >-
            What a visitor finds: `not_deployed` (nothing was ever online),
            `waiting_approval` (a publication waits for IT), `deploying`, `online`
            (a version answers, even if a later publication failed), `failed`
            (nothing online and the latest publication failed), `archived`.
        url: { type: string, description: Where the version online answers; empty when none does. }
        since: { type: [string, "null"], format: date-time, description: When the version online went live. }
        access:
          description: >-
            Who can open it now, as the cluster enforces it; `pending` is a different
            mode saved and not applied yet. Null when nothing is online or it cannot be
            told (the console then says nothing rather than guess).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ServingAccess"
        cluster:
          description: Where it runs; null before it is placed or when the clusters could not be read (`unavailable` then says `cluster`).
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        unavailable:
          type: array
          items: { type: string }
          description: The parts that could not be read now (`cluster`).
        last_change:
          description: >-
            The latest publication asked for in production, however it ended (null before the first): when and
            who asked, by name and channel, as on that deployment (`requested_by`, `requested_by_name`,
            `requested_via`). Null for an archived app.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AppChange"
    AppChange:
      type: object
      additionalProperties: false
      required: [at, reason, status, requested_by, requested_by_name, requested_via]
      properties:
        at: { type: string, format: date-time }
        reason: { type: string, enum: [deploy, rollback, auto_rollback, config] }
        status:
          type: string
          enum: [building, waiting_approval, pending, applying, verifying, ready, failed, cancelled]
          description: How that publication went (or goes).
        requested_by: { type: string, description: '"" when the platform started it.' }
        requested_by_name: { type: string, description: 'The directory''s name of who asked; "" when unknown.' }
        requested_via: { type: string, description: 'As on Deployment: console, assistant:<preset>, github, platform or "" (older).' }
    Attention:
      type: object
      additionalProperties: false
      required: [items, unavailable, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AttentionItem" }
        unavailable:
          type: array
          items: { type: string, enum: [approvals, apps, clusters, requests, github] }
          description: Sources that could not be read now; the list is then incomplete.
        truncated: { type: boolean, description: A source had more than 100 items. }
    AttentionItem:
      type: object
      additionalProperties: false
      required: [kind, scope, severity, sentence, link, app_id, environment_id, cluster_id, at]
      properties:
        kind:
          type: string
          enum: [approval_pending, app_vulnerable, cluster_disconnected, cluster_policy, deployment_failed,
                 github_not_connected, github_suspended, app_attention, publishing,
                 request_pending, request_rejected, request_failed]
        scope:
          type: string
          enum: [it, mine]
        severity:
          type: string
          enum: [critical, warning, info]
        sentence: { type: string, description: "What is going on, in plain Spanish." }
        link: { type: string, description: The console path that solves it. }
        detail: { type: string, description: "With `app_attention`, the uses' attention kind." }
        app_id: { type: [string, "null"], format: uuid }
        app_slug: { type: string, description: "With `app_id`: the app's slug, as the assistant names it." }
        environment_id: { type: [string, "null"], format: uuid }
        cluster_id: { type: [string, "null"], format: uuid }
        request_id: { type: string, format: uuid }
        at: { type: [string, "null"], format: date-time }

    AuditEntryList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        page: { $ref: "#/components/schemas/Page" }

    AssistantClient:
      type: object
      additionalProperties: false
      required: [key, name, install, skill_install, notes]
      properties:
        key: { type: string, enum: [claude_code, codex, cursor, vscode, antigravity] }
        name: { type: string, description: "The assistant as people know it (\"Claude Code\")." }
        install: { type: string, description: The command (or JSON for the client's MCP config) that registers the MCP server `odicea`. }
        install_link:
          type: string
          description: >-
            A link that registers the server in one click (`vscode:mcp/install?…`, `cursor://anysphere.cursor-deeplink/mcp/install?…`);
            absent for clients without one (their `install` is the way).
        skill_install: { type: string, description: The command that downloads and unpacks the `odicea` skill into the client's skills folder. }
        notes: { type: string, description: "Plain Spanish: how to sign in with the company account, and where the config lives." }
    Assistant:
      type: object
      additionalProperties: false
      required: [available, mcp_url, skill, clients]
      properties:
        available: { type: boolean, description: False when the MCP endpoint is not enabled here (then `clients` is empty). }
        mcp_url: { type: string, description: "The MCP endpoint (IAMKIT_AUDIENCE), e.g. https://odicea.example.com/mcp." }
        skill:
          type: object
          additionalProperties: false
          required: [url, version, name]
          properties:
            url: { type: string, description: Where to download the skill (`GET /skills/odicea.tar.gz`). }
            version: { type: string, description: A short hash of the archive; it changes when the skill does. }
            name: { type: string, enum: [odicea] }
        clients:
          type: array
          items: { $ref: "#/components/schemas/AssistantClient" }
    AssistantConnection:
      type: object
      additionalProperties: false
      required: [id, key, name, consented_at, last_used_at]
      properties:
        id: { type: string, description: "IAMKit's id for the client: what `DELETE /api/v1/me/assistants/{id}` takes." }
        key: { type: string, enum: [claude_code, codex, cursor, vscode, antigravity, other] }
        name: { type: string, description: "The assistant as people know it (\"Claude Code\", \"Otro asistente\")." }
        consented_at: { type: [string, "null"], format: date-time, description: "When the user allowed it (null: the administrator granted it)." }
        last_used_at: { type: [string, "null"], format: date-time, description: The newest refresh of its live sessions (null when none is live). }
    Me:
      type: object
      additionalProperties: false
      required: [user_id, organization_id, role, permissions, assistant]
      properties:
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        role: { type: string, enum: ["TI", "Builder", "Lector", ""], description: The catalog role the permissions match exactly; empty for none. }
        permissions:
          type: array
          items: { type: string }
          description: The token's permissions, sorted.
        assistant:
          description: Null when MCP is not served here or IAMKit could not say what is connected.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [connected, can, cannot, tools]
              properties:
                connected:
                  type: array
                  items: { $ref: "#/components/schemas/AssistantConnection" }
                can:
                  type: array
                  items: { type: string }
                  description: "Plain Spanish: what an assistant may do with these permissions (\"Ver tus apps, su estado…\")."
                cannot:
                  type: array
                  items: { type: string }
                  description: Plain Spanish, what it may not (the console says "no podrá…").
                tools:
                  type: array
                  items: { type: string }
                  description: The MCP tools these permissions let an assistant call, sorted (shown in technical mode).
    AccessKeys:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kty, crv, x, kid, use, alg]
            properties:
              kty: { type: string, enum: [OKP] }
              crv: { type: string, enum: [Ed25519] }
              x: { type: string, description: "The public key, base64url." }
              kid: { type: string }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [EdDSA] }
    PolicyEffect:
      type: string
      enum: [allow, deny, approval]
      description: What a rule does when it matches. `deny` beats `approval` beats `allow`.

    PolicyRule:
      type: object
      additionalProperties: false
      required: [id, name, description, expression, effect, approvers, enabled, builtin, version, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, description: The rule as a sentence anyone can read. }
        expression: { type: string, description: CEL over the action's input (docs/policy.md). }
        effect: { $ref: "#/components/schemas/PolicyEffect" }
        approvers: { type: string, description: The permission whose holders decide an approval. }
        enabled: { type: boolean }
        builtin: { type: [string, "null"], description: The key of a rule that comes with the product (null for IT's own). }
        version: { type: integer }
        created_by: { type: string, pattern: "^([0-9a-f-]{36})?$", description: "The user who wrote it; empty for a built-in rule." }
        updated_by: { type: string, pattern: "^([0-9a-f-]{36})?$", description: "The user who last changed it; empty until someone does, for a built-in rule." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyRuleDraft:
      type: object
      additionalProperties: false
      required: [name, expression, effect]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        expression: { type: string, minLength: 1, maxLength: 2000 }
        effect: { $ref: "#/components/schemas/PolicyEffect" }
        approvers: { type: string, description: A permission name; default `odyssey:approvals:decide`. }
        enabled: { type: boolean, description: On unless said otherwise. }

    PolicyAction:
      type: string
      enum: [deploy, set_access, connect_resource, delete_resource, set_secret, enable_ai, rollback]

    PolicyInput:
      type: object
      additionalProperties: false
      required: [action]
      description: What an action looks like to the rules. What is left out is zero (empty text, false, 0).
      properties:
        action: { $ref: "#/components/schemas/PolicyAction" }
        project:
          type: object
          additionalProperties: false
          properties:
            tier: { $ref: "#/components/schemas/ProjectTier" }
            slug: { type: string }
        env:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
        access:
          type: object
          additionalProperties: false
          properties:
            mode: { type: string, description: "The mode being set: team, organization or public." }
        actor:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            permissions:
              type: array
              items: { type: string }
        resource:
          type: object
          additionalProperties: false
          properties:
            kind: { type: string }
        scan:
          type: object
          additionalProperties: false
          properties:
            known: { type: boolean, description: "Whether a vulnerability scan exists and was done (false until it runs, and when it failed)." }
            checked: { type: boolean, description: "Whether the scan was looked at: false at the first judgment of a deployment (before the build), true after it whatever came of the scan. `checked && !known` is a scan that failed, never came or does not exist (the built-in `production_requires_scan` reads it). `known` implies `checked`." }
            critical: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
        rule:
          type: object
          additionalProperties: false
          required: [expression, effect]
          description: |
            Only for the dry run (`evaluatePolicy`): an UNSAVED rule to try
            among the saved ones, as if it were enabled. Nothing is stored.
            422 `POLICY_INVALID` when its expression does not compile.
          properties:
            name: { type: string, description: 'Defaults to "Regla de prueba".' }
            expression: { type: string, maxLength: 2000 }
            effect: { $ref: "#/components/schemas/PolicyEffect" }
            approvers: { type: string, description: A permission name (default `odyssey:approvals:decide`). }
            replaces:
              type: string
              format: uuid
              description: The saved rule this one stands in for (it is left out of the dry run), when editing.

    PolicyRuleRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PolicyEvaluation:
      type: object
      additionalProperties: false
      required: [effect, rules, approvers, results]
      properties:
        effect: { $ref: "#/components/schemas/PolicyEffect" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/PolicyRuleRef" }
          description: The matching rules of the winning effect.
        approvers:
          type: array
          items: { type: string }
          description: The permissions that can approve (only for `approval`).
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [rule, effect, enabled, matched]
            properties:
              rule: { $ref: "#/components/schemas/PolicyRuleRef" }
              effect: { $ref: "#/components/schemas/PolicyEffect" }
              enabled: { type: boolean }
              matched: { type: boolean }
              error: { type: string, description: "Why the rule could not be evaluated (a deny rule then denies, an approval rule asks for approval, an allow rule is ignored)." }

    AuditVerification:
      type: object
      additionalProperties: false
      required: [valid, entries, broken_at, verified_at]
      properties:
        valid: { type: boolean }
        entries: { type: integer, minimum: 0 }
        broken_at:
          type: [integer, "null"]
          description: The first entry whose hash or link does not match; null when valid.
        verified_at: { type: string, format: date-time, description: When the chain was re-hashed (this answer). }

    AuditSummary:
      type: object
      additionalProperties: false
      required: [from, events, people, deployments, by_channel]
      properties:
        from: { type: string, format: date-time, description: Start of the window (7 days ago). }
        events: { type: integer, minimum: 0 }
        people: { type: integer, minimum: 0, description: Distinct people who acted. }
        deployments: { type: integer, minimum: 0, description: "Publications (deployment.started)." }
        by_channel:
          type: array
          description: Publications per channel, most first ("" = not recorded).
          items:
            type: object
            additionalProperties: false
            required: [channel, count]
            properties:
              channel: { type: string }
              count: { type: integer, minimum: 0 }

    AuditPerson:
      type: object
      additionalProperties: false
      required: [actor_id, name, entries, last_at]
      properties:
        actor_id: { type: string, format: uuid }
        name: { type: string, description: '"" when the directory does not know them or is unavailable.' }
        entries: { type: integer, minimum: 1 }
        last_at: { type: string, format: date-time }

    AuditPersonList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditPerson" }

    GitHubInfo:
      type: object
      additionalProperties: false
      required: [enabled, slug]
      properties:
        enabled: { type: boolean, description: The GitHub App is configured on this Odyssey. }
        slug: { type: string, description: 'The App''s name in URLs (`github.com/apps/<slug>`); "" when disabled.' }

    GitHubInstallURL:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, description: "Where to send the browser, with a signed state." }

    GitHubInstallation:
      type: object
      additionalProperties: false
      description: An installation of Odyssey's GitHub App on a GitHub account, linked to the organization.
      required: [id, organization_id, external_id, account, account_type, all_repositories, suspended, linked_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        external_id: { type: integer, format: int64, description: GitHub's installation id. }
        account: { type: string, description: The GitHub login it is installed on. }
        account_type: { type: string, description: "`User` or `Organization`." }
        all_repositories: { type: boolean, description: Installed on every repository of the account (else on the ones chosen there). }
        suspended: { type: boolean }
        linked_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GitHubInstallationClaimed:
      type: object
      additionalProperties: false
      required: [installation, return_to]
      properties:
        installation: { $ref: "#/components/schemas/GitHubInstallation" }
        return_to: { type: string, description: The console path to go back to (starts with `/`). }

    ClaimGitHubInstallation:
      type: object
      additionalProperties: false
      required: [claim]
      properties:
        claim: { type: string, minLength: 1, maxLength: 2048, description: The `github_claim` the setup callback put in the console URL. }

    GitHubInstallationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }

    GitHubRepository:
      type: object
      additionalProperties: false
      required: [id, full_name, default_branch, private, installation_id]
      properties:
        id: { type: integer, format: int64, description: "GitHub's numeric id; survives a rename or transfer." }
        full_name: { type: string, description: '"owner/name".' }
        default_branch: { type: string }
        private: { type: boolean }
        installation_id: { type: string, format: uuid, description: The linked installation that reaches it. }

    GitHubRepositoryList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepository" }
        page: { $ref: "#/components/schemas/Page" }

    GitHubBranch:
      type: object
      additionalProperties: false
      required: [name, commit]
      properties:
        name: { type: string }
        commit: { type: string, description: The SHA of the branch head. }

    GitHubBranchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubBranch" }

    RepositoryConnection:
      type: object
      additionalProperties: false
      description: A project's repository, the branch that publishes it and how the result runs. One per project; publishes to production.
      required: [id, organization_id, project_id, installation_id, repository_id, repository, branch, root, config, last_commit, connected_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        repository_id: { type: integer, format: int64, description: GitHub's numeric repository id. }
        repository: { type: string, description: '"owner/name" as of the last (re)connect (repository_id survives a rename).' }
        branch: { type: string }
        root: { type: string, description: 'The app''s folder inside the repository; "" for its root.' }
        config: { $ref: "#/components/schemas/ReleaseConfig" }
        last_commit: { type: string, description: 'The newest commit seen on the branch; "" before the first.' }
        connected_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectRepository:
      type: object
      additionalProperties: false
      required: [installation_id, repository_id]
      properties:
        installation_id: { type: string, format: uuid, description: A linked installation of the organization. }
        repository_id: { type: integer, format: int64, minimum: 1, description: GitHub's numeric repository id. }
        branch: { type: string, maxLength: 255, description: 'Empty (default) takes the repository''s default branch.' }
        root:
          type: string
          maxLength: 200
          description: 'The app''s folder inside the repository, relative, without `.` or `..` parts. Default "" (the root).'
        port: { type: integer, minimum: 1, maximum: 65535, description: "The port the app listens on (also set as `$PORT`). Default 8080." }
        health_path: { type: string, maxLength: 200, description: "Answers 2xx when the app is healthy. Default `/`." }
        replicas: { type: integer, minimum: 1, maximum: 10, description: Default 1. }
        env:
          type: object
          maxProperties: 100
          description: Non-secret variables. Names starting with `ODYSSEY_` are reserved.
          additionalProperties: { type: string, maxLength: 4096 }

    PushStatus:
      type: string
      description: >-
        `queued` → `importing` → `deployed` | `failed`; `skipped` when a newer push of the same connection
        replaced it (only the newest commit is published).
      enum: [queued, importing, deployed, failed, skipped]

    PushFailure:
      type: object
      additionalProperties: false
      description: Why a push was not published.
      required: [code, message, detail]
      properties:
        code: { type: string }
        message: { type: string, description: In plain Spanish. }
        detail: { type: string, description: In the provider's words. }

    GitHubPush:
      type: object
      additionalProperties: false
      description: One commit of a connection to publish. A commit is published once per connection, whatever reported it.
      required: [id, organization_id, project_id, connection_id, git, trigger, status, deployment_id, error, requested_by, rebuild, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        git: { $ref: "#/components/schemas/GitRef" }
        trigger:
          type: string
          description: "`webhook`: GitHub said the branch moved. `reconcile`: the poll found the branch ahead. `manual`: someone published now (or connected the repository)."
          enum: [webhook, reconcile, manual]
        status: { $ref: "#/components/schemas/PushStatus" }
        deployment_id:
          description: The deployment it became (`deployed` only).
          oneOf:
            - type: "null"
            - { type: string, format: uuid }
        error:
          description: Why it failed (`failed` only).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PushFailure"
        requested_by: { type: string, description: '"" for a webhook or the poll, else the user''s id.' }
        rebuild: { type: boolean, description: 'Published with "Reconstruir todo": its deployment builds every service again.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GitHubPushList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubPush" }
        page: { $ref: "#/components/schemas/Page" }
